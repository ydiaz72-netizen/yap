  :root{
    --bg:#FAF7F2; --card:#FFFFFF; --ink:#1B2A41; --muted:#5B6474;
    --coral:#F25C3B; --coral-soft:#FCE6DF; --sun:#F2B544; --sun-soft:#FDF2D8;
    --teal:#2A8C82; --teal-soft:#DDEFEC; --plum:#2F4B7C; --plum-soft:#E7EDF6;
    --line:#E6E0D7; --radius:20px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
  /* keep decorative shapes from causing sideways scrolling, without trapping the page scroll */
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Plus Jakarta Sans',Nunito,system-ui,sans-serif;font-size:17px;line-height:1.45;overscroll-behavior-y:none}
  button,.chip,.react,.face,.step{touch-action:manipulation;-webkit-user-select:none;user-select:none}
  body{-webkit-touch-callout:none}
  .wrap{overflow-x:hidden;overflow-x:clip;overflow-y:visible;max-width:560px;margin:0 auto;padding:calc(20px + env(safe-area-inset-top)) calc(18px + env(safe-area-inset-right)) calc(32px + env(safe-area-inset-bottom)) calc(18px + env(safe-area-inset-left));min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
  @media (max-width:360px){ h1{font-size:30px} .prompt{font-size:21px} .big-name{font-size:38px} .timer{font-size:56px} .chip{padding:8px 12px;font-size:14px} }
  h1,h2,h3{font-family:'Plus Jakarta Sans',Nunito,sans-serif;margin:0 0 6px;line-height:1.15}
  h1{font-size:34px} h2{font-size:26px} h3{font-size:19px}
  .sub{color:var(--muted);margin:0 0 18px}
  .de{color:var(--muted);font-weight:600;font-size:.9em}
  .card{background:var(--card);border-radius:var(--radius);padding:18px;box-shadow:0 1px 2px rgba(27,42,65,.05),0 8px 24px rgba(27,42,65,.06);border:1px solid var(--line);margin-bottom:14px}
  .btn{display:block;width:100%;border:none;border-radius:16px;padding:16px 18px;font:700 18px 'Plus Jakarta Sans',Nunito,sans-serif;cursor:pointer;margin-top:10px;transition:transform .08s}
  .btn:active{transform:scale(.98)}
  .btn small{display:block;font:600 13px 'Plus Jakarta Sans',Nunito,sans-serif;opacity:.85;margin-top:2px}
  .primary{background:var(--coral);color:#fff;box-shadow:0 3px 0 #C9472A,0 8px 18px rgba(242,92,59,.18)}
  .secondary{background:var(--plum-soft);color:var(--plum)}
  .ghost{background:transparent;color:var(--muted);font-size:15px;padding:10px}
  .row{display:flex;gap:8px;flex-wrap:wrap}
  .chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:9px 14px;font:700 15px 'Plus Jakarta Sans',Nunito,sans-serif;cursor:pointer;color:var(--ink)}
  .chip.on{border-color:var(--coral);background:var(--coral-soft)}
  .chip.en.on{border-color:var(--plum);background:var(--plum-soft)}
  .chip.de.on{border-color:var(--teal);background:var(--teal-soft)}
  label.lbl{display:block;font-weight:800;font-size:14px;margin:14px 0 6px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
  input[type=text],textarea{width:100%;border:2px solid var(--line);border-radius:14px;padding:12px 14px;font:600 17px 'Plus Jakarta Sans',Nunito,sans-serif;color:var(--ink);background:#fff}
  input:focus,textarea:focus{outline:none;border-color:var(--coral)}
  .xsel{display:block;box-sizing:border-box;min-height:50px;width:100%;border:2px solid var(--line);border-radius:14px;padding:12px 14px;font:600 16px 'Plus Jakarta Sans',Nunito,sans-serif;color:var(--ink);background:#fff}
  .xlang{padding:10px 0;border-top:1px solid var(--line)}
  .xrole{gap:6px;flex-wrap:nowrap}
  .xrole .chip{padding:7px 11px;font-size:14px}
  .xgrid{display:grid;grid-template-columns:auto repeat(3,1fr);gap:6px;align-items:center}
  .xslot{min-height:44px;padding:6px;border-radius:12px;justify-content:center}
  .bcard{position:relative}
  .bcard.mine{border:2px solid var(--teal)}
  .bcard.offer{border:2px solid #F5B700}
  .btitle{font:700 19px 'Plus Jakarta Sans',Nunito,sans-serif;margin:8px 0 2px}
  .bwhen{background:#F1F4F9;border-radius:12px;padding:8px 12px;margin:8px 0;font-weight:800}
  .bwhen small{display:block;font-weight:600;color:var(--muted,var(--muted));font-size:12px}
  .btop{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
  .brow2{display:flex;gap:8px}.brow2 .btn{margin-top:8px}
  #bnav{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:560px;display:flex;gap:4px;background:#fff;border-top:1px solid var(--line);padding:6px 10px calc(8px + env(safe-area-inset-bottom));z-index:50;box-shadow:0 -4px 16px rgba(43,33,64,.07)}
  #bnav button{flex:1;background:none;border:none;font:800 13px 'Plus Jakarta Sans',Nunito,sans-serif;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:0;min-height:54px;cursor:pointer;border-radius:14px;padding:4px 0}
  #bnav button span{font-size:22px;line-height:1.2}
  #bnav button small{font-size:10px;font-weight:600;opacity:.8}
  #bnav button.on{color:var(--plum);background:var(--plum-soft)}
  body.has-nav .wrap{padding-bottom:calc(100px + env(safe-area-inset-bottom))}
  body.has-nav .ptoast{bottom:96px}
  .rhead{display:flex;justify-content:space-between;align-items:baseline;margin:6px 0 4px}
  .rcard.perfect{border:2px solid #F5B700}
  .rbadge{display:inline-block;border-radius:999px;padding:4px 10px;font-weight:800;font-size:12px;background:var(--plum-soft);color:var(--plum)}
  .rcard.perfect .rbadge{background:#FFC93C;color:#3A2A00}
  .rsec{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:12px 0 4px}
  .rwhy{margin:0;padding:0;list-style:none}.rwhy li{font-size:14px;margin:3px 0}
  .rask{background:#FFF7DC;border-radius:12px;padding:10px 12px;margin-top:8px}

  @media (min-width:768px){ body.wide .wrap, body.wide #bnav{max-width:min(90vw,760px)} }
  @media (min-width:1024px){
    body.wide.xl .wrap, body.wide.xl #bnav{max-width:900px}

  }
  @media (min-width:1400px){ body.wide.xl .wrap, body.wide.xl #bnav{max-width:1000px} }

  @media (min-width:900px){
    #bnav{display:none!important}
    #tnav{display:block;position:fixed;top:0;left:0;right:0;background:#fff;border-bottom:1px solid var(--line);z-index:50}
    #tnav .tin{max-width:1000px;margin:0 auto;padding:10px 24px;display:flex;align-items:center;gap:24px}
    #tnav .tlogo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;color:var(--ink);background:none;border:none;cursor:pointer;padding:0}
    #tnav .tlinks{display:flex;gap:4px;flex:1}
    #tnav .tlinks button{display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:10px;border:none;background:none;font:600 15px 'Plus Jakarta Sans',Nunito,sans-serif;color:var(--muted);cursor:pointer}
    #tnav .tlinks button.on{background:var(--plum-soft);color:var(--ink);font-weight:800}
    #tnav .tme{width:44px;height:44px;border-radius:22px;border:none;background:var(--plum);color:#fff;font:800 16px 'Plus Jakarta Sans',sans-serif;cursor:pointer}
    #tnav .tsign{height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:#fff;font:700 15px 'Plus Jakarta Sans',sans-serif;color:var(--ink);cursor:pointer}
    body.has-nav .wrap{padding-top:calc(84px + env(safe-area-inset-top))}
    body.has-nav .acctline{display:none}
  }
  .plogo{width:34px;height:34px;border-radius:10px;background:var(--coral);display:grid;place-items:center;flex:none}
  #bnav button svg{width:22px;height:22px}
  #bnav{gap:2px;padding-left:6px;padding-right:6px}
  #bnav button{font-size:12px}
  /* ---- Reports ---- */
  .repf{flex:none;border:none;background:none;cursor:pointer;font-size:14px;opacity:.55;padding:4px;align-self:flex-start}
  .repf:hover{opacity:1}
  .repcard{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
  .repcard.closed{opacity:.7}

  .repcard .row{gap:6px;margin-top:8px}
  .repcard .chip{font-size:13px;padding:6px 10px}
  /* ---- Session chat ---- */
  .chhead{display:flex;align-items:center;gap:10px;margin-bottom:8px}
  .chsafe{background:var(--sun-soft);border-radius:12px;padding:8px 12px;font-size:13px;color:#6B4A00;margin-bottom:8px}
  .chlist{display:flex;flex-direction:column;gap:6px;min-height:240px;max-height:calc(100vh - 330px);overflow-y:auto;padding:8px 2px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:12px}
  .cm{max-width:82%;align-self:flex-start;background:var(--bg);border-radius:16px 16px 16px 4px;padding:8px 12px;line-height:1.4;word-wrap:break-word;overflow-wrap:anywhere}

  .cm .tm{font-size:11px;opacity:.65;margin-left:8px;white-space:nowrap}
  .cm .cx{border:none;background:none;color:inherit;opacity:.5;cursor:pointer;font-size:12px;padding:0 0 0 6px}

  .pvbox{background:var(--plum-soft);border-radius:14px;padding:10px 12px;margin-top:6px}

let audio=null;
function soundOn(){ try{ return localStorage.getItem("pt_sound")!=="off"; }catch(e){ return true; } }
function ensureAudio(){ try{ if(!audio) audio=new (window.AudioContext||window.webkitAudioContext)(); if(audio.state==="suspended") audio.resume(); }catch(e){} }
document.addEventListener("pointerdown", ensureAudio, {passive:true}); // phones only allow sound after a tap
function tone(freq, dur, vol, type){
  try{ if(!audio || !soundOn()) return; const t0=audio.currentTime, o=audio.createOscillator(), g=audio.createGain();
    o.type=type||"sine"; o.frequency.value=freq; o.connect(g); g.connect(audio.destination);
    g.gain.setValueAtTime(0.0001,t0); g.gain.exponentialRampToValueAtTime(vol,t0+0.01); g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    o.start(t0); o.stop(t0+dur+0.02); }catch(e){}
}
// Last 10 seconds: soft ticks, then three rising beeps for 3-2-1.
function countdownSound(n){ if(n>3) tone(1050, 0.07, 0.12, "triangle"); else tone(n===3?660:n===2?740:830, 0.18, 0.22, "sine"); }
function toggleSound(){ try{ localStorage.setItem("pt_sound", soundOn()?"off":"on"); }catch(e){} ensureAudio(); document.querySelectorAll(".soundbtn").forEach(b=>b.textContent=soundOn()?"🔊":"🔇"); }
function soundBtn(){ return `<button class="chip soundbtn" onclick="toggleSound()" aria-label="Sound on/off">${soundOn()?"🔊":"🔇"}</button>`; }
function beep(){ if(!soundOn()) return; tone(880,0.25,0.25,"sine"); setTimeout(()=>tone(1175,0.5,0.25,"sine"),180); }
function beepOld(){ try{ if(!audio) return; const o=audio.createOscillator(), g=audio.createGain(); o.connect(g); g.connect(audio.destination); o.frequency.value=880; g.gain.setValueAtTime(.2,audio.currentTime); g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.6); o.start(); o.stop(audio.currentTime+.6);}catch(e){} }
let wake=null;
async function keepAwake(){ try{ if('wakeLock' in navigator && !wake){ wake = await navigator.wakeLock.request('screen'); } }catch(e){} }

function nextPrompt(p){ return p.level===4 ? a0Prompt(p) : choosePrompt(p.lang, p.level); }
function choosePrompt(lang, level){
  const pool = level===0 ? P1 : P, tag = level===0 ? "a1" : "std";
  const fmtKeys = ["role","quick","wwyd"];
  const fmt = fmtKeys[(S.fmtCycle++) % 3];
  const cats = S.cat==="mix" ? shuffle(["everyday","social","work","travel"]) : [S.cat];
  const tryFind = (fmts) => {
    for(const c of cats){ for(const f of fmts){
      const list = pool[lang][c][f].map((x,i)=>({...x,c,f,id:`${lang}-${tag}-${c}-${f}-${i}`})).filter(x=>!S.used.has(x.id));
      if(list.length) return pick(list);
    }}
    return null;
  };
  let p = tryFind([fmt]) || tryFind(shuffle(fmtKeys.slice()));
  if(!p){ // everything used: reset this language
    [...S.used].filter(id=>id.startsWith(`${lang}-${tag}-`)).forEach(id=>S.used.delete(id));
    p = tryFind([fmt]);
  }
  S.used.add(p.id);
  return p;
}

/* ===================== ACTIONS ===================== */
function setDraft(k,v){ S.draft[k]=v; const n=$("pname"); if(n) S.draft.name=n.value; render(); }
function addPlayer(){
  const name=(($("pname")||{}).value||"").trim();
  if(!name){ S.err="Please type a name · Bitte Namen eingeben"; render(); return; }
  if(S.players.length>=10){ S.err="Max 10 players · Maximal 10 Spieler"; render(); return; }
  if(S.players.some(p=>p.name.toLowerCase()===name.toLowerCase())){ S.err="That name is taken · Name schon vergeben"; render(); return; }
  S.players.push({name,lang:S.draft.lang,level:S.draft.level,pts:0,reacts:{clear:0,creative:0,funny:0,learned:0},tips:[]});
  S.draft.name=""; S.err=""; render();
  const i=$("pname"); if(i) i.focus();
}
function removePlayer(i){ S.players.splice(i,1); render(); }
function toSettings(){ if(S.players.length<2){ S.err="Add at least 2 players · Mindestens 2 Spieler"; render(); return; } S.err=""; go("settings"); }
function setOpt(k,v){ S[k]=v; render(); }
function setRounds(d){ S.rounds=Math.min(10,Math.max(1,S.rounds+d)); render(); }
function resetScores(){ S.players.forEach(p=>{p.pts=0;p.coach=0;p.bonus=0;p.cact=0;p.cguess=0;p.ratings=[];p.reacts={clear:0,creative:0,funny:0,learned:0};p.tips=[];}); }
function startGame(){
  try{ audio = audio || new (window.AudioContext||window.webkitAudioContext)(); }catch(e){}
  keepAwake();
  resetScores(); S.gid=uid(); S.savedIdx=null; S.log=[]; S.round=1; S.turn=0; S.rating=null; S.fmtCycle=Math.floor(Math.random()*3);
  if(S.game==="charades"){ cStartGame(); return; }
  bump("started"); go("handoff");
}
function showChallenge(){ keepAwake(); S.current=nextPrompt(S.players[S.turn]); S.rerolled=false; S.hintsUsed=false; S.timeUp=false; go("challenge"); }
function reroll(){ S.current=nextPrompt(S.players[S.turn]); S.rerolled=true; S.hintsUsed=false; render(); }
function openHints(){
  S.hintsUsed=true;
  const h=$("hints"); if(h) h.classList.add("show");
  const btn=document.querySelector(".hintbtn"); if(btn){ btn.classList.remove("hintbtn"); const n=btn.nextElementSibling; if(n && n.classList.contains("note")) n.remove(); }
}
function startTimer(){
  try{ if(audio && audio.state==="suspended") audio.resume(); }catch(e){}
  S.total = S.current.f==="quick" ? Math.round(S.time/2) : S.time; S.left=S.total; S.lastCount=null;
  $("timerBox").classList.remove("hidden"); $("startBtn").classList.add("hidden"); $("doneBtn").classList.remove("hidden");
  const rb=$("rerollBtn"); if(rb) rb.classList.add("hidden");
  tick(); S.timerId=setInterval(()=>{ S.left--; tick(); if(S.left<=0){ stopTimer(true); } },1000);
}
function tick(){
  const m=Math.floor(Math.max(S.left,0)/60), s=Math.max(S.left,0)%60;
  const t=$("timer"); if(!t) return;
  t.textContent=`${m}:${String(s).padStart(2,"0")}`;
  const low=S.left<=10; t.classList.toggle("low",low); $("bar").classList.toggle("low",low);
  if(S.left>0 && S.left<=10 && S.lastCount!==S.left){ S.lastCount=S.left; countdownSound(S.left); }
  $("barFill").style.width=`${Math.max(S.left,0)/S.total*100}%`;
}
function stopTimer(ended){ if(S.timerId){ clearInterval(S.timerId); S.timerId=null; } if(ended){ S.timeUp=true; beep(); const t=$("timer"); if(t) t.textContent="⏰ Time!"; const d=$("doneBtn"); if(d) d.innerHTML="✓ Time's up – feedback<small>Zeit um – Feedback</small>"; } }
function finishTurn(){ stopTimer(false); S.turnReacts={clear:0,creative:0,funny:0,learned:0}; S.turnRating=0; S.turnAns=""; S.turnTip=""; S.needRating=false; S.keptTalking=!!S.timeUp; go("feedback"); }
function toggleKept(){ if(!S.timeUp) return; S.keptTalking=!S.keptTalking; const y=window.scrollY; render(); window.scrollTo(0,y); }
function turnBonus(){ const b=[]; if(!S.hintsUsed) b.push({k:"nohints",e:"🙈",en:"No hints",de:"Ohne Hilfe",pts:2}); if(S.timeUp && S.keptTalking) b.push({k:"kept",e:"🎤",en:"Kept talking",de:"Bis zum Ende gesprochen",pts:2}); return b; }
function setRating(v){ S.turnRating=v; S.needRating=false; const y=window.scrollY; render(); window.scrollTo(0,y); }
function react(k){ S.turnReacts[k]++; const y=window.scrollY; render(); window.scrollTo(0,y); }
function resetReacts(){ S.turnReacts={clear:0,creative:0,funny:0,learned:0}; render(); }
function isLastTurn(){ return S.round===S.rounds && S.turn===S.players.length-1; }
function nextTurn(){
  if(!S.turnRating){ S.needRating=true; render(); window.scrollTo({top:0,behavior:"smooth"}); return; }
  const p=S.players[S.turn], tip=(S.turnTip||"").trim(), ans=(S.turnAns||"").trim();
  const R=RATINGS.find(r=>r.v===S.turnRating);
  if(tip) p.tips.push(tip);
  const bonus=turnBonus();
  S.log.push({pi:S.turn, round:S.round, q:S.current.t, qr:S.current.r||"", f:S.current.f, c:S.current.c, words:S.current.w.slice(), wr:(S.current.wr||[]).slice(), ans, tip, rating:R.v, bonus:bonus.map(b=>b.k), reacts:{...S.turnReacts}});
  p.coach+=R.pts; p.ratings.push(R.v);
  p.bonus=(p.bonus||0)+bonus.reduce((a,b)=>a+b.pts,0);
  let gained=R.pts+bonus.reduce((a,b)=>a+b.pts,0); for(const k in S.turnReacts){ p.reacts[k]+=S.turnReacts[k]; gained+=S.turnReacts[k]; }
  p.pts+=gained;
  if(isLastTurn()){ bump("completed"); go("results"); return; }
  S.turn++; if(S.turn>=S.players.length){ S.turn=0; S.round++; }
  go("handoff");
}
/* ===================== EXPORT / SHARE ===================== */
function appLink(){ try{ return location.protocol.startsWith("http") ? location.origin : "pontetalk.setzio.com"; }catch(e){ return "pontetalk.setzio.com"; } }
function today(){ const d=new Date(); return `${String(d.getDate()).padStart(2,"0")}.${String(d.getMonth()+1).padStart(2,"0")}.${d.getFullYear()}`; }
function reactLine(r){ return REACTS.filter(x=>r[x.k]).map(x=>`${x.e}${r[x.k]}`).join("  ") || "–"; }
function playerReview(i, ctx){
  ctx=ctx||{players:S.players, log:S.log, rounds:S.rounds, clog:S.clog};
  const p=ctx.players[i], L=p.lang, X=T[L], R=X.r, turns=ctx.log.filter(t=>t.pi===i);
  let out=`🌉 PonteTalk – ${R.title}\n`;
  out+=`${today()} · ${p.name} · ${X.flag} ${X.name} ${LEVELS[p.level].code}\n`;
  out+=`${R.points}: ${p.pts}\n\n`;
  if(!turns.length && !(ctx.clog||[]).length) out+=R.none+"\n";
  turns.forEach((x,n)=>{
    const a1 = p.level===0 && x.f==="wwyd";
    out+=`${n+1}) ${FMTS[x.f].e} ${a1?X.a1wwyd:X.fmt[x.f]} · ${CATS[x.c].e} ${X.cats[x.c]}\n`;
    out+=`❓ ${x.q}\n`; if(x.qr) out+=`   (${x.qr})\n`;
    if(x.rating){ out+=`🧑‍🏫 ${R.coach}: ${RATINGS[x.rating-1].e} ${X.ratings[x.rating-1]}\n`; }
    if(x.bonus && x.bonus.length) out+=`🎁 ${R.bonus}: ${x.bonus.map(k=>k==="nohints"?`🙈 ${R.nohints}`:`🎤 ${R.kept}`).join(", ")}\n`;
    if(x.ans) out+=`✍️ ${R.said}: ${x.ans}\n`;
    if(x.tip) out+=`💡 ${R.tip}: ${x.tip}\n`;
    out+=`📚 ${R.words}: ${x.words.map((w,k)=>(x.wr&&x.wr[k])?`${w} (${x.wr[k]})`:w).join(", ")}\n`;
    out+=`👏 ${R.reacts}: ${reactLine(x.reacts)}\n\n`;
  });
  out+=charadesReview(i, ctx);
  if(turns.length) out+=`🎯 ${R.practice}\n\n`;
  out+=`${R.again}: ${appLink()}`;
  return out;
}
function gameReview(ctx){
  ctx=ctx||{players:S.players, log:S.log, rounds:S.rounds, clog:S.clog};
  let out=`🌉 PonteTalk – Game summary · Spielübersicht\n${today()} · ${ctx.players.length} players · ${ctx.rounds} round(s)\n\n`;
  const ranked=ctx.players.map((p,i)=>({p,i})).sort((a,b)=>b.p.pts-a.p.pts);
  out+=`🏆 Scores\n`+ranked.map((r,n)=>`${n+1}. ${r.p.name} (${T[r.p.lang].code} ${LEVELS[r.p.level].code}) – ${r.p.pts}`).join("\n")+"\n\n";

function makeTransport(code, me, h){
  if(useLocalTransport()){

    const bc = new BroadcastChannel("pt-"+code), seen = {};

      const d=e.data;
      if(d._p){ seen[d._p.id]={...d._p, t:Date.now()}; h.onPresence(Object.values(seen)); return; }
      if(d._bye){ delete seen[d._bye]; h.onPresence(Object.values(seen)); return; }
      h.onMsg(d);
    };
    seen[me.id]={...me,t:Date.now()};
    const iv = setInterval(()=>{ beat(); const now=Date.now(); let ch=false;
      for(const k in seen){ if(k!==me.id && now-seen[k].t>6000){ delete seen[k]; ch=true; } }
      seen[me.id].t=now; if(ch) h.onPresence(Object.values(seen)); }, 1500);
    setTimeout(()=>{ beat(); h.onPresence(Object.values(seen)); h.onReady(); }, 50);
    return { send:m=>bc.postMessage(m), track:m=>{ me=m; seen[m.id]={...m,t:Date.now()}; beat(); },
             close:()=>{ clearInterval(iv); bc.postMessage({_bye:me.id}); bc.close(); } };
  }

  ch.on("presence", {event:"sync"}, () => { const st=ch.presenceState(); h.onPresence(Object.values(st).map(a=>a[0]).filter(Boolean)); });

      if(G.allow && G.allow.length && !G.allow.includes(m.uid)){ G.pending.push({id:m.id, name:m.name, lang:m.lang, level:m.level}); changed=true; return; }
      if(G.phase==="lobby"){ G.players.push(newPlayer(m)); changed=true; }
      else { G.pending.push({id:m.id, name:m.name, lang:m.lang, level:m.level}); changed=true; }
    }
    else if(G.phase==="lobby" && (ex.name!==m.name || ex.lang!==m.lang || ex.level!==m.level)){ ex.name=m.name; ex.lang=m.lang; ex.level=m.level; changed=true; }
  });
  const ids=new Set(list.map(m=>m.id));
  if(G.phase==="lobby"){
    const before=G.players.length;
    G.players=G.players.filter(p=>p.id===G.hostId || ids.has(p.id));
    if(G.players.length!==before) changed=true;
  }

function applyAction(from, a){
  const G=O.G; if(!G || !a) return;
  const active = G.players[G.turn] || {}, isActive = from===active.id, isHost = from===G.hostId, tp=G.tp;
  if(!isHost && !G.players.some(p=>p.id===from)) return; // people waiting outside can't play
  if(oCApply(from, a, isActive, isHost)){ pushState(); return; }
  switch(a.type){
    case "lock": if(isHost){ G.locked=!G.locked; } break;
    case "chat": if(a.text && String(a.text).trim()){ const pl=G.players.find(p=>p.id===from); if(pl){
        G.chat=(G.chat||[]).concat([{id:uid(), pid:from, by:pl.name, text:String(a.text).trim().slice(0,300), t:Date.now()}]).slice(-100); } } break;
    case "chatdel": if(isHost){ G.chat=(G.chat||[]).filter(m=>m.id!==a.id); } break;
    case "accept": if(isHost && G.pending){ const q=G.pending.find(x=>x.id===a.id); if(q){ G.pending=G.pending.filter(x=>x.id!==a.id); if(!G.players.some(p=>p.id===q.id) && G.players.length<10) G.players.push(newPlayer(q)); } } break;
    case "decline": if(isHost && G.pending){ G.pending=G.pending.filter(x=>x.id!==a.id); G.declined=[...(G.declined||[]), a.id]; } break;
    case "settings": if(isHost && G.phase==="lobby"){ if(a.cat) G.cat=a.cat; if(a.rounds) G.rounds=Math.min(10,Math.max(1,a.rounds)); if(a.time) G.time=a.time;
        if(a.game){ G.game=a.game; if(a.game==="charades" && G.time>90) G.time=60; if(a.game!=="charades" && G.time<60) G.time=90; }
        if(a.cdiff!==undefined) G.cdiff=a.cdiff;
        if(a.cmode) G.cmode=a.cmode; } break;
    case "start": if(isHost && (G.phase==="lobby"||G.phase==="results") && G.players.length>=2) oStart(); break;
    case "lobby": if(isHost){ G.phase="lobby"; G.tp=null; } break;
    case "kick": if(isHost && G.phase==="lobby" && a.id!==G.hostId){ G.players=G.players.filter(p=>p.id!==a.id); G.declined=[...(G.declined||[]), a.id]; } break;
    case "hint": if(G.phase==="turn" && isActive) tp.hintsUsed=true; break;
    case "reroll": if(G.phase==="turn" && isActive && !tp.rerolled && !tp.timer){ G.current=active.level===4 ? a0Prompt(active) : oPick(active.lang, active.level); tp.rerolled=true; tp.hintsUsed=false; } break;
    case "timer": if(G.phase==="turn" && (isActive||isHost) && !tp.timer){
        const total = G.current.f==="quick" ? Math.round(G.time/2) : G.time;
        tp.timer={ id:uid(), total, endsAt:Date.now()+total*1000, remainMs:total*1000 };
        if(O.hostTimeout) clearTimeout(O.hostTimeout);
        O.hostTimeout=setTimeout(()=>{ if(O.G.tp && O.G.tp.timer && O.G.phase==="turn"){ O.G.tp.timeUp=true; O.G.tp.kept=true; pushState(); } }, total*1000+150);
      } break;
    case "done": if(G.phase==="turn" && (isActive||isHost)){ if(O.hostTimeout){ clearTimeout(O.hostTimeout); O.hostTimeout=null; } G.phase="feedback"; } break;
    case "skip": if(isHost && (G.phase==="turn"||G.phase==="feedback"||G.phase==="cturn"||G.phase==="csum")){ if(O.hostTimeout){ clearTimeout(O.hostTimeout); O.hostTimeout=null; } oAdvance(); } break;
    case "react": if(G.phase==="feedback" && !isActive){ tp.reactsBy[from] = tp.reactsBy[from]===a.k ? undefined : a.k; if(tp.reactsBy[from]===undefined) delete tp.reactsBy[from]; } break;
    case "rate": if(G.phase==="feedback" && (!isActive||isHost) && RATINGS.some(r=>r.v===a.v)){ tp.rating=a.v; tp.ratedBy=from; } break;
    case "kept": if(G.phase==="feedback" && !isActive && tp.timeUp) tp.kept=!tp.kept; break;
    case "note": if(G.phase==="feedback" && a.text && String(a.text).trim()){ const by=(G.players.find(p=>p.id===from)||{}).name||"?"; tp.notes.push({type:a.note==="ans"?"ans":"tip", text:String(a.text).trim().slice(0,300), by}); } break;
    case "next": if(G.phase==="feedback" && (!isActive||isHost) && tp.rating){ oScore(); oAdvance(); } break;
    default: return;
  }
  pushState();
}

function stopOnlineTick(){ if(O.tickId){ clearInterval(O.tickId); O.tickId=null; } }
function onlineTick(){
  const G=O.G, t=G&&G.tp&&G.tp.timer, el=$("otimer"); if(!t){ stopOnlineTick(); return; }
  const left = G.tp.timeUp ? 0 : Math.max(0, Math.ceil((O.localEnd-Date.now())/1000));
  const timed = G.phase==="turn" || G.phase==="cturn";
  if(left===0 && beepArmed && timed){ beepArmed=false; beep(); }
  if(left>0 && left<=10 && timed && O.lastCount!==left+"|"+t.id){ O.lastCount=left+"|"+t.id; countdownSound(left); }
  if(!el) return;
  el.textContent = left===0 ? "⏰ Time!" : `${Math.floor(left/60)}:${String(left%60).padStart(2,"0")}`;
  el.classList.toggle("low", left<=10);
  const bar=$("obar"), fill=$("obarFill"); if(bar){ bar.classList.toggle("low", left<=10); fill.style.width = `${left/t.total*100}%`; }
}

function oCtx(){ return {players:O.G.players, log:O.G.log||[], rounds:O.G.rounds, clog:O.G.clog||[]}; }
function oRate(n){ const first=O.rating===null; O.rating=n; const s=loadStats(); if(first) s.ratings.push(n); else s.ratings[s.ratings.length-1]=n; saveStats(s); renderOnline(true); }

/* ---------- small helpers ---------- */
async function shareRoom(){
  const text=`Join my PonteTalk game 🌉 Code: ${O.code}\n${roomLink()}`;
  try{ if(navigator.share){ await navigator.share({title:"PonteTalk", text}); return; } }catch(e){ return; }
  location.href = "https://wa.me/?text="+encodeURIComponent(text);
}
async function copyRoom(){
  const m=$("roomMsg");
  try{ await navigator.clipboard.writeText(roomLink()); if(m) m.textContent="Link copied! · Kopiert!"; }
  catch(e){ if(m) m.textContent=roomLink(); }
}
function confirmLeave(){
  const box=document.createElement("div");
  box.style.cssText="position:fixed;inset:0;background:rgba(43,33,64,.45);display:grid;place-items:center;padding:20px;z-index:9";
  box.innerHTML=`<div class="card" style="max-width:360px;width:100%"><h3>Leave this game?</h3><p class="note">${O.role==="host"?"You're the host — the game stops for everyone.":"You can rejoin with the same code."}</p>
    <button class="btn primary" id="lYes">Leave · Verlassen</button><button class="btn ghost" id="lNo">Stay · Bleiben</button></div>`;
  document.body.appendChild(box);
  $("lNo").onclick=()=>box.remove(); $("lYes").onclick=()=>{ box.remove(); onlineLeave(); };
}
function hostMenu(){
  const box=document.createElement("div");
  box.className="sheet-bg";
  box.innerHTML=`<div class="sheet"><div class="topline"><h3 style="margin:0">⚙️ Host</h3><button class="chip" id="hmX">✕</button></div>
    <button class="btn secondary" id="hmSkip">⏭️ Skip this turn<small>No points · Ohne Punkte</small></button>
    <button class="btn secondary" id="hmEnd">🏁 End game now<small>Show results · Ergebnisse zeigen</small></button>
    <button class="btn ghost" id="hmLobby">👥 Back to lobby</button></div>`;
  document.body.appendChild(box);
  const close=()=>box.remove();
  $("hmX").onclick=close; box.addEventListener("click",e=>{ if(e.target===box) close(); });
  $("hmSkip").onclick=()=>{ close(); act({type:"skip"}); };
  $("hmEnd").onclick=()=>{ close(); if(O.hostTimeout){ clearTimeout(O.hostTimeout); O.hostTimeout=null; } O.G.phase="results"; O.G.tp=null; bump("completed"); pushState(); };
  $("hmLobby").onclick=()=>{ close(); act({type:"lobby"}); };
}

/* ---------- render glue ---------- */
function renderOnline(force){
  if(S.screen!=="lobby") return;
  const G=O.G;
  renderChat();
  // During feedback, update only the live part so typing in the note boxes isn't interrupted.
  const key = G ? `${G.phase}|${G.round}|${G.turn}|${(G.pending||[]).length}|${G.locked?1:0}|${oOutsider()?1:0}` : "none";
  if(!force && G && G.phase==="feedback" && O.viewKey===key && $("odyn")){
    const y=window.scrollY; $("odyn").innerHTML=oFeedbackDyn(); if($("odyn2")) $("odyn2").innerHTML=oFeedbackDyn2(); window.scrollTo(0,y); return;
  }
  const turnKey = G ? `${G.phase}|${G.round}|${G.turn}` : "none";
  if(O.turnKey!==turnKey){ O.turnKey=turnKey; O.draftAns=""; O.draftTip=""; O.sentNote=""; if(G && G.phase!=="results") O.rating=null; }
  const sameView = (O.viewKey||"").split("|").slice(0,3).join("|")===turnKey, y=window.scrollY;
  O.viewKey=key;
  const keep={}; document.querySelectorAll("[data-keep]").forEach(el=>{ keep[el.id]={v:el.value, f:document.activeElement===el, s:el.selectionStart}; });
  $("app").innerHTML = VIEWS.lobby();
  for(const id in keep){ const el=$(id); if(el){ el.value=keep[id].v; if(keep[id].f){ el.focus({preventScroll:true}); try{ el.setSelectionRange(keep[id].s,keep[id].s); }catch(e){} } } }
  if(sameView) window.scrollTo(0,y); else window.scrollTo(0,0);
  if(G && G.tp && G.tp.timer) onlineTick();
}
// Re-check the host connection banner every few seconds.
setInterval(()=>{ if(S.screen==="lobby" && O.role==="guest") renderOnline(); }, 4000);
// Open the join screen straight from an invite link (?join=CODE).
(function(){ try{ const c=new URLSearchParams(location.search).get("join"); if(c){ O.codeInput=c.toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,4); S.screen="online"; } }catch(e){} })();

  if(stage===2 && learned.length){

    const others=learned.filter(id=>id!==st.lastSent);
    const id = others.length ? others[others.length-1] : learned[learned.length-1];
    st.lastSent=id;
    const it=a0Item(id,L), fr=A0_FRAME[L]||A0_FRAME.en;
    const t=fr[0].replace("{w}", it.w), r=(fr[1] && it.r) ? fr[1].replace("{r}", it.r) : "";
    return {f:"a0sent", c:"everyday", id:`${L}-a0-s-${id}-${st.n}`, t:`${it.e}  ${t}`, r, w:[it.w, ...meaning(it)], wr:[it.r]};
  }
  const id=fresh(), it=a0Item(id,L);
  return {f:"a0new", c:"everyday", id:`${L}-a0-n-${id}-${st.n}`, t:`${it.e}  ${it.w}`, r:it.r, w:meaning(it), wr:[]};
}

function cPick(diff, used){
  let pool = CW.map((x,i)=>i).filter(i => diff==="mix" || CW[i][1]===diff);
  let free = pool.filter(i=>!used.includes(i));
  if(!free.length){ used.splice(0, used.length, ...used.filter(i=>!pool.includes(i))); free=pool.slice(); }
  const i = pick(free); used.push(i); return i;
}
function cAnswerChips(i, langs){
  return langs.map(l=>`<span class="hint" dir="${T[l].dir}" lang="${l}">${T[l].flag} ${esc(cWord(i,l))}${romP(cRoman(i,l))}</span>`).join("");
}
function cGuesserLangs(players, actorIdx){ return [...new Set(players.filter((p,j)=>j!==actorIdx).map(p=>p.lang))]; }
function cDiffChips(cur, players, onclickFn){
  const auto = cAutoDiff(players);
  return `<div class="row">
    <button class="chip ${cur==="auto"?"on":""}" onclick="${onclickFn}('auto')">✨ Auto · ${CDIFF[auto].e} ${CDIFF[auto].en}</button>
    ${CDIFF.map(d=>`<button class="chip ${cur===d.k?"on":""}" onclick="${onclickFn}(${typeof d.k==="string"?`'${d.k}'`:d.k})">${d.e} ${d.en} · ${d.de}</button>`).join("")}</div>
    <p class="note" style="margin:6px 0 0">${cur==="auto"?`Picked from the lowest level at the table · nach dem niedrigsten Niveau`:esc((CDIFF.find(d=>d.k===cur)||{}).hint||"")}</p>`;
}
function gameChips(cur, fn){

}

function cGuess(i){

function cSkip(){

function charadesAwards(players){
  const best=k=>players.map((p,i)=>({p,i})).sort((a,b)=>(b.p[k]||0)-(a.p[k]||0))[0];
  const row=(k,e,en,de)=>{ const b=best(k); if(!b||!(b.p[k])) return ""; return `<div class="award"><span class="e">${e}</span><div>${en} <span class="de">· ${de}</span><br><span style="color:${COLORS[b.i%COLORS.length]}">${esc(b.p.name)}</span> <span class="note">(${b.p[k]})</span></div></div>`; };
  return row("cact","🎭","Best actor","Beste/r Schauspieler/in")+row("cguess","🧠","Best guesser","Beste/r Rater/in");
}
function charadesReview(i, ctx){
  const p=ctx.players[i], L=p.lang, items=(ctx.clog||[]).filter(x=>x.actor===i||x.by===i);
  if(!items.length) return "";
  const seen=new Set(); let out=`🎭 Charades\n`;
  items.forEach(x=>{ if(seen.has(x.w)) return; seen.add(x.w);
    const role = x.skip ? "⏭️" : x.actor===i ? "🎭" : "🧠";
    out+=`${role} ${CW[x.w][0]} ${cWord(x.w,L)}${cRoman(x.w,L)?` [${cRoman(x.w,L)}]`:""}${L!=="en"?`  (${cWord(x.w,"en")})`:""}\n`; });
  return out+`\n🎭 = you acted · 🧠 = you guessed · ⏭️ = skipped\n\n`;
}

function oCCredit(by){
  const G=O.G, tp=G.tp, actor=G.players[G.turn], g=G.players[by];
  tp.guessed.push({w:tp.w, by}); G.clog.push({actor:G.turn, w:tp.w, by});
  actor.pts++; actor.cact=(actor.cact||0)+1; g.pts++; g.cguess=(g.cguess||0)+1;
  tp.last={w:tp.w, by}; oCPickNext();
}
function oCApply(from, a, isActive, isHost){
  const G=O.G, tp=G.tp;
  switch(a.type){
    case "cstart": if(G.phase==="cturn" && (isActive||isHost) && !tp.timer){
        tp.cstarted=true; oCPickNext();
        const total=G.time; tp.timer={ id:uid(), total, endsAt:Date.now()+total*1000, remainMs:total*1000 };
        if(O.hostTimeout) clearTimeout(O.hostTimeout);
        O.hostTimeout=setTimeout(()=>{ if(O.G.phase==="cturn"){ O.G.tp.timeUp=true; O.G.phase="csum"; pushState(); } }, total*1000+150);
      } return true;
    case "cguess": if(G.phase==="cturn" && (isActive||isHost) && tp.timer && tp.w!==null && G.players[a.by] && a.by!==G.turn){ oCCredit(a.by); } return true;
    case "cclue": if(G.phase==="cturn" && isActive && tp.timer && Array.isArray(a.clue)){
        tp.clue = a.clue.slice(0,12).map(x=>String(x).slice(0,12));
      } return true;
    case "cguesstext": if(G.phase==="cturn" && !isActive && tp.timer && !tp.timeUp && tp.w!==null && a.text){
        const gi=G.players.findIndex(p=>p.id===from); if(gi<0) return true;
        const ok=cMatches(a.text, tp.w, G.players[gi].lang);
        tp.feed=(tp.feed||[]).concat([{by:G.players[gi].name, text:String(a.text).slice(0,60), ok}]).slice(-20);
        if(ok){ oCCredit(gi); }
      } return true;
    case "cskip": if(G.phase==="cturn" && (isActive||isHost) && tp.timer && tp.w!==null){
        tp.skips.push(tp.w); G.clog.push({actor:G.turn, w:tp.w, skip:true}); tp.last={w:tp.w, skip:true}; oCPickNext();
      } return true;
    case "cend": if(G.phase==="cturn" && (isActive||isHost)){ if(O.hostTimeout){ clearTimeout(O.hostTimeout); O.hostTimeout=null; } tp.timeUp=true; G.phase="csum"; } return true;
    case "cnext": if(G.phase==="csum" && (isActive||isHost)){ oAdvance(); } return true;
  }
  return false;
}

  pt:["o","a","os","as","um","uma"], pl:[], uk:[], ar:[]};
function cNorm(s, lang){
  s=String(s||"").toLowerCase().trim();
  if(lang==="ar"||lang==="ur"){ s=s.replace(/[ً-ْـٰ]/g,"").replace(/[أإآ]/g,"ا").replace(/ة/g,"ه").replace(/[ىيےۓ]/g,"ی").replace(/ك/g,"ک").replace(/[هۀہھ]/g,"ہ");
    if(lang==="ar") s=s.replace(/(^|\s)ال/g,"$1"); }
  else { s=s.normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/ß/g,"ss"); }
  s=s.replace(/[.,!?¿¡'"“”„«»()…\-–—]/g," ").replace(/\s+/g," ").trim();
  const arts=(ARTICLES[lang]||[]).map(a=>a.normalize("NFD").replace(/[̀-ͯ]/g,""));
  return s.split(" ").filter(w=>!arts.includes(w)).join(" ");
}
function lev(a,b){ const m=a.length,n=b.length; if(Math.abs(m-n)>2) return 9; const d=Array.from({length:m+1},(_,i)=>[i]); for(let j=1;j<=n;j++) d[0][j]=j;
  for(let i=1;i<=m;i++) for(let j=1;j<=n;j++) d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1)); return d[m][n]; }
function romNorm(s){ return String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/\b(al|an|ar|as|at|ad|ash|adh|az|ath)-/g,"").replace(/['’`\-.,!?…]/g,"").replace(/\s+/g," ").trim(); }
function cMatches(guess, w, lang){
  const rom=cRoman(w,lang);
  if(rom && /[a-z]/i.test(guess)){ const g=romNorm(guess); return rom.split("/").map(romNorm).some(t=>t && (g===t || (t.length>=4 && lev(g,t)<=1) || (t.length>=7 && lev(g,t)<=2))); }
  const g=cNorm(guess,lang); if(!g) return false;
  return cWord(w,lang).split("/").map(x=>cNorm(x,lang)).some(t=> t && (g===t || (t.length>=5 && lev(g,t)<=1) || (t.length>=9 && lev(g,t)<=2)));
}

function chatAllowed(){ return S.screen==="lobby" && O.G && O.status!=="idle" && !oOutsider() && O.G.players.some(p=>p.id===O.me.id); }
function renderChat(){
  let box=$("ochat");
  document.body.classList.toggle("has-chat", chatAllowed());

  const msgs=O.G.chat||[], unread=Math.max(0, msgs.length-(O.chatSeen||0));
  if(O.chatOpen){ O.chatSeen=msgs.length; }
  const keepVal = ($("chatin")||{}).value || O.chatDraft || "", hadFocus = document.activeElement && document.activeElement.id==="chatin";
  const list = msgs.length ? msgs.map(m=>{
      const mine=m.pid===O.me.id, idx=O.G.players.findIndex(p=>p.id===m.pid), col=COLORS[(idx<0?0:idx)%COLORS.length];
      return `<div class="cm ${mine?"me":""}">${mine?"":`<div class="cmn" style="color:${col}">${esc(m.by)}</div>`}
        <div class="cmb" dir="auto">${esc(m.text)}</div>

    : `<p class="note center" style="margin:30px 0">No messages yet. Say hi! 👋<br><span class="de">Noch keine Nachrichten.</span></p>`;
  box.innerHTML = O.chatOpen ? `
    <div class="chatpanel">
      <div class="chathead"><b>💬 Room chat · ${esc(O.code)}</b><span style="display:flex;gap:6px">${msgs.length?`<button class="chip" id="chatExport" onclick="exportChat()" aria-label="Export chat">📤 Export</button>`:""}<button class="chip" onclick="toggleChat()" aria-label="Close chat">✕</button></span></div>
      <p class="note" style="margin:0 12px 6px">Only players in this game can see it. Messages disappear when the game ends.</p>
      <div class="chatlist" id="chatlist">${list}</div>
      <div class="chatquick">${["👋","👍","😂","❤️","🎉","👏","🙏"].map(e=>`<button onclick="sendChat('${e}')">${e}</button>`).join("")}</div>

        oninput="O.chatDraft=this.value" onkeydown="if(event.key==='Enter')sendChat()"><button class="btn primary" onclick="sendChat()">➤</button></div>

    : `<button class="chatfab" onclick="toggleChat()" aria-label="Open chat">💬${unread?`<span class="chatbadge">${unread>9?"9+":unread}</span>`:""}</button>`;
  if(O.chatOpen){
    const inp=$("chatin"); if(inp){ inp.value=keepVal; if(hadFocus) inp.focus({preventScroll:true}); }
    const l=$("chatlist"); if(l) l.scrollTop=l.scrollHeight;
  }
}
function chatText(){
  const msgs=(O.G&&O.G.chat)||[], pad=n=>String(n).padStart(2,"0");

async function sendCode(){
  const inp=$("aemail"), email=((inp&&inp.value)||A.email||"").trim().toLowerCase();
  A.email=email;
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ A.err="Please type a valid email · Bitte gültige E-Mail eingeben"; render(); return; }
  const sb=authClient(); if(!sb){ A.err=offlineMsg(); render(); return; }
  A.busy=true; A.err=""; A.msg=""; render();
  try{
    const { error } = await sb.auth.signInWithOtp({ email, options:{ shouldCreateUser:true } });
    if(error) throw error;
    A.step="code"; A.msg="";
  }catch(e){ A.err=authErr(e); }
  A.busy=false; render();
}
async function verifyCode(){
  const inp=$("acode"), token=((inp&&inp.value)||A.code||"").replace(/\D/g,"");
  A.code=token;
  if(token.length<6){ A.err="Type the code from the email · Code aus der E-Mail eingeben"; render(); return; }
  A.busy=true; A.err=""; render();
  try{
    const { data, error } = await A.sb.auth.verifyOtp({ email:A.email, token, type:"email" });
    if(error) throw error;
    A.busy=false; A.msg="";
    await authSet(data.user || (data.session && data.session.user));
    if(A.profile && A.profile.display_name) authReturn(); else render();
    return;
  }catch(e){ A.err=authErr(e); }
  A.busy=false; render();
}
async function googleSignIn(){
  const sb=authClient(); if(!sb){ A.err=offlineMsg(); render(); return; }
  try{ sessionStorage.setItem("pt_ret", A.ret||"home"); }catch(e){}
  A.busy=true; A.err=""; render();
  try{
    const { error } = await sb.auth.signInWithOAuth({ provider:"google", options:{ redirectTo: location.origin + location.pathname + "?auth=google" } });
    if(error) throw error;
  }catch(e){ A.busy=false; A.err=authErr(e); render(); }
}
function authReturn(){
  // After signing in: go back to where the person came from (e.g. the results screen to save the game)
  const r=A.ret||"home";
  if(r==="results" && S.players.length && S.gid) go("results");
  else if(r==="lobby" && O.G) go("lobby");
  else if(r==="shop") shOpen();
  else if(r==="cafes") cfOpen();
  else if(r==="reports") raOpen();
  else if(r==="stats") stOpen();
  else if(r==="shopitem" && SH.oneId){ go("shopitem"); shOneLoad(SH.oneId); }
  else if(r==="board") bOpen();
  else if(r==="session" && S.sid) sOpen(S.sid);
  else if(r==="account") go("account");
  else goHome();
}
function authErr(e){
  const m=String((e&&e.message)||e||"").toLowerCase();
  if(!navigator.onLine) return offlineMsg();
  if(m.includes("rate") || m.includes("security purposes") || m.includes("too many")) return "Too many tries — please wait a minute and try again · Bitte kurz warten";
  if(m.includes("expired") || m.includes("invalid") || m.includes("otp") || m.includes("token")) return "That code is wrong or expired. Try again or send a new one · Code falsch oder abgelaufen";
  if(m.includes("provider is not enabled") || m.includes("unsupported provider")) return "Google sign-in isn't switched on yet · Google-Anmeldung noch nicht aktiv";
  return "Something went wrong — please try again · Etwas ist schiefgelaufen";
}

function gameRecord(mode, ctx, i, key, game){
  const p=ctx.players[i];
  const rank=1+ctx.players.filter(q=>q.pts>p.pts).length;
  const rating=(p.ratings&&p.ratings.length) ? Math.round(p.ratings.reduce((a,b)=>a+b,0)/p.ratings.length*100)/100 : null;
  let review=""; try{ review=playerReview(i, ctx).slice(0,19000); }catch(e){}
  return { client_key:String(key).slice(0,80), played_at:new Date().toISOString(), mode, game, lang:p.lang, level:p.level,
           rounds:ctx.rounds, players:ctx.players.length, score:p.pts, rank, rating, review };
}
function inpersonRecord(i){ return gameRecord("inperson", {players:S.players, log:S.log, rounds:S.rounds, clog:S.clog}, i, `ip-${S.gid}-${i}`, S.game); }
function onlineRecord(){
  const G=O.G, i=G.players.findIndex(p=>p.id===O.me.id); if(i<0) return null;
  return gameRecord("online", oCtx(), i, `on-${G.gid||O.code}-${O.me.id}`, G.game==="charades"?"emoji":"speak");
}
async function saveRecord(rec){
  if(!A.user) return "auth";
  const row={...rec, user_id:A.user.id};
  try{
    if(!navigator.onLine) throw new Error("offline");
    const { error } = await A.sb.from("games").upsert(row, { onConflict:"user_id,client_key", ignoreDuplicates:true });
    if(error) throw error;
    if(A.games && !A.games.some(g=>g.client_key===rec.client_key)) A.games.unshift({...rec, id:null});
    loadGames();
    return "ok";
  }catch(e){
    const q=lsGet("pt_queue",[]); if(!q.some(r=>r.client_key===rec.client_key)) q.push(rec); lsSet("pt_queue", q.slice(-30));
    return "queued";
  }
}
async function flushQueue(){
  if(!A.user || !navigator.onLine) return;
  const q=lsGet("pt_queue",[]); if(!q.length) return;
  const left=[];
  for(const rec of q){
    try{ const { error } = await A.sb.from("games").upsert({...rec, user_id:A.user.id}, { onConflict:"user_id,client_key", ignoreDuplicates:true }); if(error) throw error; }
    catch(e){ left.push(rec); }
  }
  lsSet("pt_queue", left.length?left:null);
  if(left.length<q.length) loadGames();
}
async function saveInperson(i){
  if(!S.gid) return;
  A.saving["ip-"+S.gid]="busy"; render();
  const r=await saveRecord(inpersonRecord(i));

function bErr(e){

  if(tc) return `⏰ You already have “${tc[1].trim()}” at this time. You can't be in two sessions at once. · Du hast zu dieser Zeit schon „${tc[1].trim()}“.`;
  for(const k in BERR) if(m.includes(k)) return BERR[k];
  if(/row-level security|violates row/i.test(m)) return "Not allowed. Check your exchange profile (18+) and pick a future time · Nicht erlaubt";
  const g=authErr(e);
  // Unknown problem: show the database's own words too, so it can be fixed
  return (g.startsWith("Something went wrong") && m) ? `${g} (${m.slice(0,160)})` : g;

const AV = {};   // user_id -> photo URL ("" = none)
function avUrl(uid){ if(A.user && uid===A.user.id) return (A.profile&&A.profile.avatar_url)||""; return AV[uid]||""; }
function avSpan(uid,name){ const u=avUrl(uid); return u ? `<img class="pav" src="${esc(u)}" alt="" loading="lazy">` : `<span class="pav" aria-hidden="true">${esc((name||"?").charAt(0).toUpperCase())}</span>`; }
function avSmall(uid){ const u=avUrl(uid); return u ? `<img class="avs" src="${esc(u)}" alt="" loading="lazy">` : "👤"; }
let AV_T=null;
function avCollect(){
  if(!A.user || !A.sb) return;
  const ids=new Set();
  (B.list||[]).concat(D.board||[], R.list||[]).forEach(x=>{ if(x.host_id) ids.add(x.host_id); });
  Object.values(B.people||{}).forEach(L=>(L||[]).forEach(p=>ids.add(p.user_id)));
  (AT.list||[]).forEach(p=>ids.add(p.user_id));
  const need=[...ids].filter(id=>id && !(id in AV) && id!==A.user.id);
  if(!need.length) return;
  need.forEach(id=>AV[id]="");
  clearTimeout(AV_T);
  AV_T=setTimeout(async()=>{
    try{
      const { data, error } = await A.sb.rpc("pt_avatars",{ p_ids:need.slice(0,200) });
      if(error) return;
      let any=false; (data||[]).forEach(r=>{ if(r.avatar_url){ AV[r.id]=r.avatar_url; any=true; } });
      if(any){ if(["board","session","home"].includes(S.screen)) xr(); if(document.getElementById("attSheet")) attShow(); }
    }catch(e){}
  },60);
}
function avPathFromUrl(u){ const m=String(u||"").match(/\/avatars\/(.+)$/); return m?decodeURIComponent(m[1].split("?")[0]):""; }
async function avRemoveFile(u){ const p=avPathFromUrl(u); if(p) await A.sb.storage.from("avatars").remove([p]); }
function avShrink(file){
  return new Promise((ok,bad)=>{
    const img=new Image(), url=URL.createObjectURL(file);
    img.onload=()=>{
      const n=Math.min(img.naturalWidth,img.naturalHeight), sx=(img.naturalWidth-n)/2, sy=(img.naturalHeight-n)/2;
      const c=document.createElement("canvas"); c.width=c.height=256;
      const g=c.getContext("2d"); g.fillStyle="#fff"; g.fillRect(0,0,256,256);
      g.drawImage(img,sx,sy,n,n,0,0,256,256);
      URL.revokeObjectURL(url);
      c.toBlob(b=>b?ok(b):bad(new Error("convert")),"image/jpeg",0.85);
    };
    img.onerror=()=>{ URL.revokeObjectURL(url); bad(new Error("not_image")); };
    img.src=url;
  });
}
let AV_BUSY=false;
async function avPick(inp){
  const f=inp.files&&inp.files[0]; inp.value=""; if(!f || AV_BUSY) return;
  if(!/^image\//.test(f.type||"image/")){ bToast("Please pick a photo · Bitte ein Foto wählen"); return; }
  if(f.size>20*1024*1024){ bToast("That photo is too big · Foto zu groß"); return; }
  AV_BUSY=true; xr();
  try{
    const blob=await avShrink(f), uid=A.user.id, path=`${uid}/${Date.now()}.jpg`;
    const up=await A.sb.storage.from("avatars").upload(path, blob, { contentType:"image/jpeg", upsert:false, cacheControl:"31536000" });
    if(up.error) throw up.error;
    const url=A.sb.storage.from("avatars").getPublicUrl(path).data.publicUrl;
    const old=A.profile&&A.profile.avatar_url;
    const r=await A.sb.from("profiles").update({ avatar_url:url }).eq("id",uid); if(r.error) throw r.error;
    A.profile.avatar_url=url;
    if(old) avRemoveFile(old).catch(()=>{});
    bToast("📷 Photo saved · Foto gespeichert");
  }catch(e){ bToast(/not_image|convert/.test(String(e&&e.message))?"This file can't be used as a photo. Try a JPG or PNG · Bitte JPG oder PNG":bErr(e)); }
  AV_BUSY=false; render();
}
async function avRemove(){
  if(!A.profile || !A.profile.avatar_url || AV_BUSY) return;
  if(!window.confirm("Remove your photo? · Foto entfernen?")) return;
  AV_BUSY=true; xr();
  try{
    const old=A.profile.avatar_url;
    const r=await A.sb.from("profiles").update({ avatar_url:null }).eq("id",A.user.id); if(r.error) throw r.error;
    A.profile.avatar_url=null; avRemoveFile(old).catch(()=>{});
    bToast("Photo removed · Foto entfernt");
  }catch(e){ bToast(bErr(e)); }
  AV_BUSY=false; render();
}

async function cfSave(){
  const f=CF.f; if(!f || CF.busy) return;
  const name=f.name.trim(), url=vClean(f.url), city=f.city.trim(), country=f.country.trim(), address=f.online?"":(f.address||"").trim().slice(0,200);
  CF.err="";
  if(name.length<2) CF.err="Please add the café's name · Bitte Namen eingeben";
  else if(url && !vValid(url)) CF.err="Please paste the full link to their page (https://…) · Bitte vollständigen Link einfügen";
  else if(f.online && !url) CF.err="Online cafés need a link, so people can join · Online-Cafés brauchen einen Link";
  else if(!f.online && !url && !address && !f.note.trim()) CF.err="No website? Please add the address or a short note (when / where) · Bitte Adresse oder Notiz";
  else if(!f.online && !city) CF.err="Please add the city · Bitte Stadt eingeben";
  else if(!f.languages.length) CF.err="Pick at least one language · Mindestens eine Sprache wählen";
  if(CF.err){ xr(); return; }
  CF.busy=true; xr();
  try{
    const row={ name, url:url||null, address:address||null, city:city||null, country:country||null, online:!!f.online, languages:f.languages, note:f.note.trim()||null };
    if(CF.admin){
      const r = f.id ? await A.sb.from("cafes").update(row).eq("id",f.id)
                     : await A.sb.from("cafes").insert(Object.assign({ status:"approved", submitted_by:A.user.id }, row));
      if(r.error) throw r.error;
      CF.msg = f.id ? "✓ Saved · Gespeichert" : "✓ Added and live · Veröffentlicht";
    }else{
      const { error } = await A.sb.rpc("pt_suggest_cafe",{ p_name:name, p_city:city, p_country:country, p_online:!!f.online, p_languages:f.languages, p_url:url||null, p_note:f.note.trim(), p_address:address||null });
      if(error) throw error;
      CF.msg="🙏 Thanks! Your suggestion is waiting for a quick check · Danke! Wir prüfen deinen Vorschlag.";
    }
    CF.busy=false; CF.f=null; go("cafes"); cfLoad();
  }catch(e){ CF.busy=false; const m=String((e&&e.message)||e); const k=Object.keys(CF_ERR).find(x=>m.includes(x)); CF.err=k?CF_ERR[k]:bErr(e); xr(); }
}

const VL = {};   // activity_id -> { url, provider } (only host / joined people get rows back)
const V_PROV = { jitsi:"Jitsi", zoom:"Zoom", meet:"Google Meet", whatsapp:"WhatsApp", teams:"Teams", other:"video call" };
function vProvider(u){
  const h=String(u||"").toLowerCase();
  return /meet\.jit\.si|jitsi/.test(h)?"jitsi" : /zoom\.us|zoom\.com/.test(h)?"zoom" : /meet\.google/.test(h)?"meet"
       : /whatsapp/.test(h)?"whatsapp" : /teams\.microsoft|teams\.live/.test(h)?"teams" : "other";
}
function vClean(u){
  let x=String(u||"").trim(); if(!x) return "";
  if(!/^https?:\/\//i.test(x) && /^[\w-]+(\.[\w-]+)+(\/|$)/.test(x)) x="https://"+x;
  x=x.replace(/^http:\/\//i,"https://");
  return x;
}
function vValid(u){ return /^https:\/\/[^\s<>"]+\.[^\s<>"]+$/i.test(u) && u.length>=12 && u.length<=500; }
async function vLoad(){

const V_EARLY=30;   // minutes before the start when guests can open the video link
function vBtn(id, primary, s){
  const v=VL[id]; if(!v) return "";
  const name=esc(V_PROV[v.provider]||"video call");
  if(s && !s.is_host && s.starts_at){
    const st=new Date(s.starts_at).getTime(), open=st-V_EARLY*60000, end=st+(s.duration_min||60)*60000+30*60000, now=Date.now();
    if(now>=end) return `<span class="btn vbtn vlock" aria-disabled="true">🎥 Session ended · Vorbei</span>`;
    if(now<open){
      const t=new Date(open).toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"});
      return `<a class="btn ${primary?"primary":""} vbtn vlock" data-open="${open}" href="${esc(v.url)}" target="_blank" rel="noopener noreferrer" onclick="return vLockClick(this)">🎥 Opens at ${t} · öffnet um ${t}</a>`;
    }
  }
  return `<a class="btn ${primary?"primary":""} vbtn" href="${esc(v.url)}" target="_blank" rel="noopener noreferrer">🎥 Join ${name} · Videoanruf</a>`;
}
function vLockClick(a){
  const open=+a.dataset.open; if(!open || Date.now()>=open) return true;

async function bAct(fn,id){
  if(["pt_join_activity","pt_accept_invite","pt_accept_offer"].includes(fn) && !safetyOk()){
    const x=bRowOf({ activity_id:id }); if(x && x.format==="in_person"){ safetyOpen(fn,id); return; }
  }
  if(B.busy) return;
  B.busy=true; xr();
  try{
    const { data, error } = await A.sb.rpc(fn,{ p_activity:id });
    if(error) throw error;

    const sideTxt = data && data.side ? (()=>{ const x=(B.list||[]).concat(R.list||[]).find(q=>q.activity_id===id); const k=x?(data.side==="a"?x.language_a:x.language_b):null; return k&&T[k]?` (${T[k].nameEn} speakers)`:""; })() : "";

          : st==="pending" ? "⏳ Request sent. The host will reply · Anfrage gesendet"
          : st==="waitlisted" ? `🕒 You're #${data.position} on the waitlist${sideTxt} · Platz ${data.position} auf der Warteliste`
          : st==="declined_invite" ? "Invite declined · Einladung abgelehnt"
          : st==="expired" ? "Sorry, the offer ran out · Das Angebot ist abgelaufen"
          : st==="cancelled" ? (data.late ? "Done. Leaving less than 2h before start counts as a late cancel · Spät abgesagt" : "Done · Erledigt")
          : "Done · Erledigt");

/* ---- Board game sessions → private game room ---- */
async function bRoom(id, asHost){
  const s=(B.list||[]).find(x=>x.activity_id===id); if(!s || B.busy) return;
  B.busy=true;
  try{
    if(asHost){
      const r=await A.sb.rpc("pt_open_room",{ p_activity:id, p_code:newCode() });
      if(r.error) throw r.error;
    }
    const r2=await A.sb.rpc("pt_session_room",{ p_activity:id });
    if(r2.error) throw r2.error;
    const code=r2.data.code, allow=r2.data.allow||[];
    S.draft.name=(meName()||S.draft.name||"Player").slice(0,16);
    if(A.profile){ if(T[A.profile.practicing]) S.draft.lang=A.profile.practicing; if(A.profile.level!=null) S.draft.level=A.profile.level; }
    B.busy=false;
    if(asHost){
      const prev=loadSession();
      if(prev && prev.role==="host" && prev.code===code && prev.G){ onlineConnect("host", code, prev.G); O.G.allow=[A.user.id].concat(allow); saveSession(); return; }
      onlineConnect("host", code, null);
      O.G.game = s.game==="speak" ? "speak" : "charades";
      if(s.game!=="speak") O.G.cmode = s.game==="emoji" ? "emoji" : "camera";
      O.G.allow = [A.user.id].concat(allow);
      O.G.session = id;
      saveSession();
      logUsage("room_created", {mode:"online", game:s.game, langs:[S.draft.lang], levels:[S.draft.level], players:1});
    } else {
      onlineConnect("guest", code, null);
    }
  }catch(e){ B.busy=false; bToast(bErr(e)); }
}

function hPad(n){ return String(n).padStart(2,"0"); }
function hOpen(){
  if(!A.user){ A.ret="board"; A.err=""; A.msg="Sign in to host a session · Melde dich an, um eine Session anzubieten"; go("account"); return; }

async function hPrefill(){

    const [l,p] = await Promise.all([
      A.sb.from("user_languages").select("language_code,role,level").eq("user_id",uid),
      A.sb.from("profiles").select("adult_confirmed_at,city").eq("id",uid).maybeSingle()
    ]);
    H.adult=!!(p.data&&p.data.adult_confirmed_at);
    if(!H.city && p.data && p.data.city) H.city=p.data.city;
    const mine=(l.data||[]).filter(x=>T[x.language_code]);
    H.myLangs=mine.map(x=>({ code:x.language_code, role:x.role }));
    if(!H.a){
      const speak=mine.find(x=>x.role!=="learning"), learn=mine.find(x=>x.role==="learning");
      if(speak){ H.a=speak.language_code; if(learn) H.b=learn.language_code; }

function hJitsi(){

async function hPost(){

  if(start.getTime() <= Date.now()+(H.editId?60000:5*60000)){ H.err="Pick a time in the future · Wähle eine Zeit in der Zukunft"; xr(); return; }

      starts_at:start.toISOString(), host_time_zone:detectTz(), duration_min:H.dur, join_mode:H.mode, topics:H.topics, visibility:H.vis==="private"?"private":"public",

    if(error) throw error;

const R = { list:null, mine:[], at:0, uid:null, noProfile:false };
const TOPIC_CAT = { work:"work", travel:"travel", food:"social", culture:"social", family:"social", music:"social", movies:"social", sports:"social", books:"social", gaming:"social" };
function rMaybeLoad(){
  if(!A.user){ R.list=null; R.uid=null; return; }
  if(R.uid!==A.user.id){ R.uid=A.user.id; R.list=null; R.at=0; }
  if(Date.now()-R.at > 60000) rLoad();
}
async function rLoad(){
  if(!A.user || !A.sb) return;
  R.at=Date.now();
  try{
    const [r,l] = await Promise.all([
      A.sb.rpc("pt_recommended_sessions",{ p_limit:5 }),
      A.sb.from("user_languages").select("language_code,role,level").eq("user_id",A.user.id)
    ]);
    if(r.error) throw r.error;
    R.mine=(l.data||[]).map(x=>({code:x.language_code, role:x.role, level:x.level}));
    R.noProfile=!R.mine.length;
    R.list=r.data||[];
  }catch(e){ R.list=R.list||[]; }
  if(S.screen==="home") xr();
}
function rHash(str){ let h=0; for(const c of String(str)) h=(h*31+c.charCodeAt(0))|0; return Math.abs(h); }
function rPrompt(s){
  // a starter question from the game's own question bank, in the language I'd practice
  try{
    const mineL=R.mine.find(m=>m.role==="learning" && (m.code===s.language_a||m.code===s.language_b));
    const lang=mineL ? mineL.code : s.language_a;
    const lowLevel=mineL && mineL.level!=null && mineL.level<=1;
    const pool=(lowLevel?P1:P)[lang]; if(!pool) return null;
    const cat=TOPIC_CAT[(s.topics||[])[0]] || "everyday";
    const list=(pool[cat]&&pool[cat].quick) || (pool.everyday&&pool.everyday.quick) || [];
    if(!list.length) return null;
    const q=list[rHash(s.activity_id)%list.length];
    return { lang, t:q.t };
  }catch(e){ return null; }
}
async function rAct(fn,id){ await bAct(fn,id); R.at=0; rLoad(); }
async function rHide(id){
  try{ const { error } = await A.sb.rpc("pt_hide_session",{ p_activity:id }); if(error) throw error;
    R.list=(R.list||[]).filter(x=>x.activity_id!==id); bToast("Hidden. We won't show it again · Ausgeblendet"); xr();
  }catch(e){ bToast(bErr(e)); }
}
async function rShare(id){
  const s=(R.list||[]).find(x=>x.activity_id===id); if(!s) return;
  const url=(location.protocol.startsWith("http")?location.origin:"https://pontetalk.setzio.com")+"/?board";
  const text=`${s.title} · ${fmtWhen(s.starts_at)} on PonteTalk`;
  try{ if(navigator.share){ await navigator.share({ title:"PonteTalk", text, url }); return; } }catch(e){ return; }
  try{ await navigator.clipboard.writeText(text+" "+url); bToast("Link copied · Link kopiert 📋"); }catch(e){ bToast(url); }
}
function rCard(s){
  const id=s.activity_id, g=s.type==="game"?GAMES_BOARD.find(x=>x[0]===s.game):null;
  const hostT=fmtHostTime(s.starts_at, s.host_time_zone), q=rPrompt(s);

    <div class="btop"><span class="rbadge">${s.perfect_match?"⭐ Perfect match":"👍 Good match"}</span><span class="note" style="margin:0;font-weight:800">${full?"Full":`${s.seats_open} of ${s.seats} open`}</span></div>
    <div class="btitle">${g?`${g[1]} `:""}${esc(s.title)}</div>
    <div class="note" style="margin:0">${langPair(s.language_a,s.language_b)} · ${lvlRange(s.level_min,s.level_max)}${g?` · ${esc(g[2])}`:""}</div>
    <div class="rsec">Who speaks what · Wer spricht was</div>
    <div style="font-size:14px">${avSmall(s.host_id)} <b>${esc(s.host_name||"Host")}</b>${relBadges(s.host_reliability)}${s.host_reliability&&s.host_reliability.percent!=null?` <span class="note">(${s.host_reliability.percent}% shows up)</span>`:""}: ${langsLine(s.host_languages)||"–"}</div>
    <div style="font-size:14px;margin-top:2px">🙂 <b>You</b>: ${langsLine(R.mine)||"–"}</div>
    ${(s.reasons||[]).length?`<div class="rsec">Why this matches you · Warum es passt</div>
      <ul class="rwhy">${s.reasons.map(r=>`<li>✅ ${esc(r)}</li>`).join("")}</ul>`:""}
    ${(s.topics||[]).length?`<div class="row" style="margin-top:10px">${s.topics.map(k=>{ const it=INTERESTS.find(x=>x[0]===k); return it?`<span class="feat">${it[1]} ${esc(it[2])}</span>`:""; }).join("")}</div>`:""}
    ${q?`<div class="rask"><b>💬 Try asking · Frag doch mal</b><span dir="${T[q.lang]?T[q.lang].dir:"ltr"}" lang="${q.lang}">${esc(q.t)}</span></div>`:""}
    <div class="bwhen">🗓️ ${fmtWhen(s.starts_at)} <span class="yt">your time</span> · ${s.duration_min} min${hostT?`<small>${esc(hostT)}</small>`:""}</div>${zonesLine(s)}
    ${placeLine(s)}
    <button class="btn ${full?"secondary":"primary"}" onclick="rAct('pt_join_activity','${id}')" ${B.busy?"disabled":""}>${label}</button>
    <div class="row" style="justify-content:center;margin-top:8px">
      <button class="chip" onclick="rHide('${id}')">🙈 Not interested</button>
      <button class="chip" aria-label="Share" onclick="sShare('${id}')">🔗 Share</button>
    </div>
  </div>`;
}

function shMatch(it){

  if(!SH.mineOnly && SH.admin && it.approval==="pending" && !it.is_owner) return false;

  if(F.lang.length && it.language && !F.lang.includes(it.language)) return false;

function shErr(e){

  if(/too_many_resources/.test(m)) return "You've shared 50 resources. Please delete some first · Maximal 50";
  if(/sign in/i.test(m)) return "Please sign in to download · Bitte anmelden";
  if(/not found/i.test(m)) return "This resource isn't available any more · Nicht mehr verfügbar";
  if(/row-level security|violates row|Unauthorized|403/i.test(m)) return "Only admins can do this · Nur für Admins";
  if(/exceeded|too large|413/i.test(m)) return "File too big (max 50 MB) · Datei zu groß";

}

/* In-app preview: shows the pages inside PonteTalk (doesn't depend on the browser's PDF settings) */
let PDFJS=null;
async function shPdfjs(){
  if(PDFJS) return PDFJS;
  const m=await import("/pdfjs/pdf.min.js");
  m.GlobalWorkerOptions.workerSrc="/pdfjs/pdf.worker.min.js";
  return PDFJS=m;

function shPvClose(){

async function shPreview(id){
  if(!A.user){ A.ret=S.screen==='shopitem'?'shopitem':'shop'; A.err=""; A.msg=""; go("account"); return; }
  const it=(SH.list||[]).concat(SH.one?[SH.one]:[]).find(x=>x.id===id) || {};
  shPvClose();
  const o=document.createElement("div"); o.id="pvov"; o.className="pvov"; o._urls=[];
  o.innerHTML=`<div class="pvbox" role="dialog" aria-modal="true" aria-label="Preview">
    <div class="pvhd"><b>👁 ${esc(it.title||"Preview")}</b><button class="chip" onclick="shPvClose()" aria-label="Close">✕</button></div>
    <div class="pvbody" id="pvbody"><p class="note center" style="margin:40px 0">Loading preview… · Vorschau lädt…</p></div>
    <div class="pvft"><button class="btn primary" onclick="shPvClose();shGet('${id}')">⬇ Download</button></div></div>`;
  o.addEventListener("click", e=>{ if(e.target===o) shPvClose(); });
  document.body.appendChild(o); document.body.style.overflow="hidden"; document.addEventListener("keydown", shPvKey);
  const body=document.getElementById("pvbody");
  const fail=msg=>{ if(document.getElementById("pvov")===o) body.innerHTML=`<div class="err">${esc(msg)}</div>`; };
  try{
    const r=await A.sb.rpc("pt_shop_preview",{ p_item:id });
    if(r.error) throw r.error;
    const u=await A.sb.storage.from("shop").createSignedUrl(r.data.path, 600);
    if(u.error) throw u.error;
    const res=await fetch(u.data.signedUrl); if(!res.ok) throw new Error("Could not load the file ("+res.status+")");
    const name=(r.data.name||it.file_name||"").toLowerCase();
    if(document.getElementById("pvov")!==o) return;
    if(/\.pdf$/.test(name)){
      const pdfjs=await shPdfjs();
      const doc=await pdfjs.getDocument({ data:new Uint8Array(await res.arrayBuffer()) }).promise;
      const MAX=10, n=Math.min(doc.numPages, MAX);
      body.innerHTML="";
      const w=Math.min(body.clientWidth-4, 820), dpr=Math.min(window.devicePixelRatio||1, 2);
      for(let i=1;i<=n;i++){
        if(document.getElementById("pvov")!==o) return;
        const pg=await doc.getPage(i), vp0=pg.getViewport({ scale:1 }), sc=w/vp0.width, vp=pg.getViewport({ scale:sc*dpr });
        const c=document.createElement("canvas"); c.width=vp.width; c.height=vp.height; c.style.width=w+"px"; c.className="pvpage";
        body.appendChild(c);
        await pg.render({ canvasContext:c.getContext("2d"), viewport:vp }).promise;
      }
      const note=document.createElement("p"); note.className="note center";
      note.textContent = doc.numPages>MAX ? `Showing ${MAX} of ${doc.numPages} pages. Download to see everything.` : `${doc.numPages} page${doc.numPages>1?"s":""}`;
      body.appendChild(note);
    }else{
      const blob=await res.blob(), url=URL.createObjectURL(blob); o._urls.push(url);
      if(/\.(png|jpe?g|webp|gif)$/.test(name)) body.innerHTML=`<img src="${url}" alt="" class="pvpage" style="max-width:100%">`;
      else if(/\.(mp3|m4a|wav)$/.test(name)) body.innerHTML=`<div class="center" style="padding:30px 0"><div style="font-size:44px">🎧</div><audio controls src="${url}" style="width:100%;margin-top:10px"></audio></div>`;
      else { const t=await blob.text(); body.innerHTML=`<pre class="pvtxt">${esc(t.slice(0,20000))}${t.length>20000?"\n…":""}</pre>`; }
    }
  }catch(e){ fail(/pt_shop_preview/.test(String(e&&e.message))?"Preview isn't switched on yet (step 30). · Vorschau noch nicht aktiv.":shErr(e)); }
}

async function shSave(){
  const f=SH.f; if(!f || SH.busy) return;
  const title=(f.title||"").trim(), link=f.src==="link"?vClean(f.link):"";
  if(title.length<2){ SH.err="Please add a title · Bitte einen Titel eingeben"; xr(); return; }
  if(f.src==="link" && !vValid(link)){ SH.err="Please paste the full link (https://…) · Bitte vollständigen Link einfügen"; xr(); return; }
  if(f.src==="file" && !f.file && !f.path){ SH.err="Please choose a file · Bitte eine Datei wählen"; xr(); return; }
  if(!SH.admin && !f.rights){ SH.err="Please confirm you may share it · Bitte bestätigen"; xr(); return; }
  SH.busy=true; SH.err=""; xr();
  try{
    let path=f.src==="file"?f.path:null, name=f.src==="file"?f.fileName:null, size=f.src==="file"?f.size:null, oldPath=null;
    if(f.src==="file" && f.file){
      const safe=f.file.name.normalize("NFKD").replace(/[^\w.\-]+/g,"_").replace(/_+/g,"_").slice(-80) || "file";
      const key=(window.crypto && crypto.randomUUID) ? crypto.randomUUID() : (Date.now().toString(36)+Math.random().toString(36).slice(2));
      const newPath=`${A.user.id}/${key}/${safe}`;
      const up=await A.sb.storage.from("shop").upload(newPath, f.file, { contentType:f.file.type||"application/octet-stream", upsert:false });
      if(up.error) throw up.error;
      if(f.id && f.path) oldPath=f.path;
      path=newPath; name=f.file.name; size=f.file.size;
    }
    if(f.src==="link" && f.id && f.path) oldPath=f.path;   // switched from file to link: free the space
    const row={ title, description:(f.desc||"").trim()||null, language:f.lang||null, level:f.lvl<0?null:f.lvl, kind:f.kind, published:!!f.published,
                base_language:f.base||"en", topics:f.topics||[], visibility:f.vis==="public"?"public":"unlisted",
                file_path:path, file_name:name, file_size:size, link_url:f.src==="link"?link:null };
    let id=f.id;
    if(f.id){
      const r=await A.sb.from("shop_items").update(row).eq("id",f.id); if(r.error) throw r.error;
    }else{
      row.created_by=A.user.id;
      const r=await A.sb.from("shop_items").insert(row).select("id").single(); if(r.error) throw r.error; id=r.data&&r.data.id;
    }
    if(oldPath) A.sb.storage.from("shop").remove([oldPath]).catch(()=>{});
    SH.busy=false; SH.f=null; go("shop");
    SH.msg = row.visibility==="unlisted" ? "✓ Saved. Tap 🔗 Share link on your resource to send it · Gespeichert"
           : SH.admin ? (f.id?"✓ Saved · Gespeichert":"✓ Published · Veröffentlicht")
           : "📨 Thanks! We'll take a quick look, then it appears in the Shop · Danke, wir prüfen es kurz";
    SH.mineOnly = !SH.admin; SH.list=null; xr(); shLoad();
    if(row.visibility==="unlisted" && id && !f.id) setTimeout(()=>shShare(id), 400);
  }catch(e){ SH.busy=false; SH.err=shErr(e); xr(); }
}

function weekStart(d){ const x=new Date(d); x.setHours(0,0,0,0); const wd=(x.getDay()+6)%7; x.setDate(x.getDate()-wd); return x; }
function weekStats(isoList){
  const ws=weekStart(new Date()), we=new Date(ws.getTime()+7*864e5), now=Date.now();
  const days=[0,0,0,0,0,0,0].map(()=>""), weeks=new Set(); let count=0, done=0;
  isoList.forEach(iso=>{ const t=new Date(iso);
    weeks.add(weekStart(t).getTime());
    if(t>=ws && t<we){ count++; if(t.getTime()<=now) done++; const i=(t.getDay()+6)%7; days[i] = t.getTime()<=now ? "done" : (days[i]||"plan"); } });
  let streak=0, w=ws.getTime(); if(!weeks.has(w)) w-=7*864e5;
  while(weeks.has(w)){ streak++; w-=7*864e5; }
  return { count, done, goal:2, days, streak };
}

const NB = { list:[], unread:0, timer:null };
ICO.bell = '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>';

}
function bellSync(){ document.querySelectorAll(".nbbell").forEach(b=>{ b.outerHTML=bellBtn(); }); }

async function nbLoad(){

function nbAgo(iso){
  const m=Math.max(0,Math.round((Date.now()-new Date(iso).getTime())/60000));
  if(m<1) return "just now · gerade eben"; if(m<60) return `${m} min ago`;
  const h=Math.round(m/60); if(h<24) return `${h} h ago`;
  const d=Math.round(h/24); return d===1?"yesterday · gestern":`${d} days ago`;
}
function nbClock(iso){ try{ return new Date(iso).toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"}); }catch(e){ return ""; } }
function nbText(n){
  const t=`<b>${esc(n.title||"a session")}</b>`, who=esc(n.from_name||"Someone"), d=n.data||{};
  switch(n.kind){
    case "seat_offer":   return `🎉 A seat is free for you in ${t}.${d.expires_at?` Accept by ${nbClock(d.expires_at)}.`:""}`;
    case "join_request": return `🔔 ${who} wants to join ${t}. Tap to approve or decline.`;
    case "report":       return `🚩 New report (${esc((RP_REASONS.find(r=>r[0]===d.reason)||[0,"other"])[1])}). Tap to review.`;
    case "chat":         return `💬 ${d.count>1?`${d.count} new messages`:`New message${n.from_name?` from ${who}`:""}`} in ${t}.`;
    case "invited":      return `📩 ${who} invited you to ${t}. Tap to accept or decline.`;
    case "reschedule":   return d.answer==="accepted" ? `✅ ${who} accepted the new time for ${t}: ${d.proposed_at?esc(fmtWhen(d.proposed_at)):""}.`
                              : d.answer==="declined" ? `↩️ ${who} can't make the new time for ${t}. It stays as planned.`
                              : `🔁 ${who} suggests moving ${t} to ${d.proposed_at?esc(fmtWhen(d.proposed_at)):"a new time"}. Tap to answer.`;
    case "session_match": return `✨ New session that fits you: ${t}${n.starts_at?` · ${esc(fmtWhen(n.starts_at))}`:""}${d.lang&&T[d.lang]?` · practise ${T[d.lang].flag} ${esc(T[d.lang].nameEn)}`:""}. Tap to sign up.`;
    case "new_joiner":   return `👋 ${who} joined ${t}.`;
    case "approved":     return d.waitlist_position ? `🕒 Approved for ${t}. You're #${d.waitlist_position} on the waitlist.` : `✅ You're in: ${t}.`;
    case "declined":     return `Your request for ${t} wasn't accepted this time.`;
    case "cancelled":    return `❌ ${t} was cancelled by the host.`;
    case "changed":      return `📝 ${t}: ${nbChanges(d)}`;
    case "reminder_24h": return `⏰ Tomorrow: ${t}${n.starts_at?` at ${nbClock(n.starts_at)}`:""}.`;
    case "reminder_15m": return `⏰ ${t} starts in 15 minutes.`;
    default:             return `Update for ${t}.`;
  }
}
function nbChanges(d){
  const ch=Array.isArray(d.changes)?d.changes:[];
  if(!ch.length) return "updated by the host.";
  const day=iso=>{ try{ return new Date(iso).toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"}); }catch(e){ return ""; } };
  const one=c=>{
    if(c.field==="time") return day(c.from)===day(c.to) ? `${nbClock(c.from)} → ${nbClock(c.to)} (${day(c.to)})` : `${fmtWhen(c.from)} → ${fmtWhen(c.to)}`;
    if(c.field==="length") return `${c.from} → ${c.to} min`;
    if(c.field==="title") return `new title "${esc(c.to)}"`;
    if(c.field==="place") return "new meeting place 📍";
    if(c.field==="video") return "new video call link 🎥";
    if(c.field==="languages") return `languages now ${(c.to||[]).filter(Boolean).map(k=>T[k]?T[k].nameEn:k).join(" ⇄ ")}`;
    return "";
  };
  return ch.map(one).filter(Boolean).join(" · ")+".";
}
function nbItems(){
  if(!NB.list.length) return `<p class="note center" style="margin:24px 0">No notifications yet · Noch keine Benachrichtigungen</p>`;
  return NB.list.map(n=>`<div class="nbrow"><button class="nbitem ${n.read_at?"":"unread"}" onclick="nbTap(${n.id})">
      <span class="nbu ${n.read_at?"r":""}"></span><span>${nbText(n)}<small>${nbAgo(n.created_at)}</small></span></button>
      <button class="nbx" aria-label="Clear this notification" title="Clear · Entfernen" onclick="nbClear(${n.id})">✕</button></div>`).join("");
}
function nbOpen(){
  const old=document.getElementById("nbSheet"); if(old) old.remove();
  const box=document.createElement("div"); box.className="sheet-bg"; box.id="nbSheet";
  box.innerHTML=`<div class="sheet" role="dialog" aria-label="Notifications">
    <div class="nbhead"><h3 style="margin:0">Notifications · Benachrichtigungen</h3>
      <button class="chip" aria-label="Close" onclick="document.getElementById('nbSheet').remove()">✕</button></div>
    <div id="nbTools" class="row" style="gap:16px;margin:0 0 6px">${nbTools()}</div>
    <div id="nbList">${nbItems()}</div>
    <p class="note center" style="margin:10px 0 0"><button class="linkbtn" onclick="document.getElementById('nbSheet').remove();A.ret='home';go('account');setTimeout(()=>{const e=document.getElementById('npc');if(e)e.scrollIntoView({behavior:'smooth',block:'start'})},80)">Notification settings · Einstellungen</button></p></div>`;
  box.addEventListener("click",e=>{ if(e.target===box) box.remove(); });
  document.body.appendChild(box);
  nbLoad();
}
async function nbTap(id){
  const n=NB.list.find(x=>x.id===id); if(!n) return;
  if(!n.read_at){ n.read_at=new Date().toISOString(); NB.unread=Math.max(0,NB.unread-1); bellSync(); try{ await A.sb.rpc("pt_mark_read",{ p_id:id }); }catch(e){} }
  const sh=document.getElementById("nbSheet"); if(sh) sh.remove();
  if(n.kind==="report"){ raOpen(); return; }
  if(n.activity_id){ if(n.kind==="chat") chOpen(n.activity_id); else sOpen(n.activity_id); }
}
function nbTools(){
  if(!NB.list.length) return "";
  return `${NB.unread?`<button class="linkbtn" onclick="nbReadAll()">Mark all as read · Alle gelesen</button>`:""}
    <button class="linkbtn" onclick="nbClearAll()">Clear all · Alle entfernen</button>`;
}
function nbRefreshPanel(){
  const l=document.getElementById("nbList"); if(l) l.innerHTML=nbItems();
  const t=document.getElementById("nbTools"); if(t) t.innerHTML=nbTools();
  bellSync();
}
async function nbClear(id){
  NB.list=NB.list.filter(n=>n.id!==id); NB.unread=NB.list.filter(n=>!n.read_at).length; nbRefreshPanel();
  try{ await A.sb.rpc("pt_clear_notifications",{ p_id:id }); }catch(e){}
}

/* ---- anonymous usage counts for the owner stats: no names, no IP, no device id ---- */
function logUsage(kind, d){
  try{
    if(/transport=local/.test(location.search)) return;
    const sb=authClient(); if(!sb || !navigator.onLine) return;
    const row={ kind, mode:d.mode, game:d.game, langs:(d.langs||[]).slice(0,10), levels:(d.levels||[]).slice(0,10),
                players:Math.max(1,Math.min(10,d.players||1)), rounds:Math.max(0,Math.min(50,d.rounds||0)), signed_in:!!A.user };
    sb.from("usage_events").insert(row).then(()=>{}, ()=>{});
  }catch(e){}
}
const LOGGED={};
function logInpersonFinished(){
  if(!S.gid || LOGGED["ip-"+S.gid]) return; LOGGED["ip-"+S.gid]=1;
  logUsage("game_finished", {mode:"inperson", game:S.game||"speak", langs:S.players.map(p=>p.lang), levels:S.players.map(p=>p.level), players:S.players.length, rounds:S.rounds});
}
function logOnlineFinished(){
  const G=O.G; if(!G || O.role!=="host" || G.phase!=="results") return;
  const k="on-"+(G.gid||O.code)+"-"+G.round; if(LOGGED[k]) return; LOGGED[k]=1;
  logUsage("game_finished", {mode:"online", game:G.game==="charades"?"emoji":"speak", langs:G.players.map(p=>p.lang), levels:G.players.map(p=>p.level), players:G.players.length, rounds:G.rounds});
}

/* Start: remember where to return after Google sign-in, then connect */
try{ const u=new URL(location.href); if(u.searchParams.get("auth")==="google" || u.searchParams.has("code")){ S.screen="account"; A.ret=sessionStorage.getItem("pt_ret")||"home"; sessionStorage.removeItem("pt_ret"); if(A.ret==="results"||A.ret==="lobby") A.ret="home"; } }catch(e){}
// supabase.js loads with 'defer', so it is ready only once the page has finished loading
if(window.supabase) authInit(); else document.addEventListener("DOMContentLoaded", authInit);
try{ const sid=new URLSearchParams(location.search).get("s"); if(sid && /^[0-9a-f-]{36}$/i.test(sid)){ S.sid=sid; S.screen="session"; document.addEventListener("DOMContentLoaded", ()=>bLoad()); } }catch(e){}
try{ if(new URLSearchParams(location.search).has("stats")){ S.screen="stats"; let n=0; const w=setInterval(()=>{ n++; if(A.status==="in"&&A.user){ clearInterval(w); stLoad(); } else if((A.status==="out"&&n>2)||n>20){ clearInterval(w); A.ret="stats"; A.msg="Sign in to see stats · Bitte anmelden"; go("account"); } },500); } }catch(e){}
try{ if(new URLSearchParams(location.search).has("reports")){ S.screen="reports"; let n=0; const w=setInterval(()=>{ n++; if(A.status==="in"&&A.user){ clearInterval(w); raLoad(); } else if((A.status==="out"&&n>2)||n>20){ clearInterval(w); A.ret="reports"; A.msg="Sign in to see reports · Bitte anmelden"; go("account"); } },500); } }catch(e){}
try{ const rid=new URLSearchParams(location.search).get("r"); if(rid && /^[0-9a-f-]{36}$/i.test(rid)){ S.screen="shopitem"; SH.one=null; A.ret="shopitem"; SH.oneId=rid; document.addEventListener("DOMContentLoaded", ()=>shOneLoad(rid)); } }catch(e){}
try{ if(new URLSearchParams(location.search).has("shop")){ S.screen="shop"; document.addEventListener("DOMContentLoaded", ()=>shLoad()); } }catch(e){}
try{ if(new URLSearchParams(location.search).has("cafes")){ S.screen="cafes"; document.addEventListener("DOMContentLoaded", ()=>cfLoad()); } }catch(e){}
try{ if(new URLSearchParams(location.search).has("board")){ S.screen="board"; document.addEventListener("DOMContentLoaded", ()=>bLoad()); } }catch(e){}

render();
/* Offline support + installable app (only works on the real website, safely skipped elsewhere) */
try{ if('serviceWorker' in navigator && location.protocol==='https:'){ window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{})); } }catch(e){}
/* Keep the screen awake again if the phone was switched away and back mid-game */
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible' && S.screen!=='home'){ wake=null; keepAwake(); } });
