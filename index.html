<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Language Table Game · EN/DE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FFF6EC; --card:#FFFFFF; --ink:#2B2140; --muted:#6E6680;

    --teal:#20A99A; --teal-soft:#D6F3EF; --plum:#6C4AB6; --plum-soft:#E9E2F8;
    --line:#EADFD3; --radius:20px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,sans-serif;font-size:17px;line-height:1.45}
  .wrap{max-width:560px;margin:0 auto;padding:20px 18px 40px;min-height:100vh;display:flex;flex-direction:column}
  h1,h2,h3{font-family:Fredoka,Nunito,sans-serif;margin:0 0 6px;line-height:1.15}
  h1{font-size:34px} h2{font-size:26px} h3{font-size:19px}
  .sub{color:var(--muted);margin:0 0 18px}
  .de{color:var(--muted);font-weight:600;font-size:.9em}
  .card{background:var(--card);border-radius:var(--radius);padding:18px;box-shadow:0 2px 0 var(--line);border:1.5px solid var(--line);margin-bottom:14px}
  .btn{display:block;width:100%;border:none;border-radius:16px;padding:16px 18px;font:700 18px Fredoka,Nunito,sans-serif;cursor:pointer;margin-top:10px;transition:transform .08s}
  .btn:active{transform:scale(.98)}
  .btn small{display:block;font:600 13px Nunito,sans-serif;opacity:.85;margin-top:2px}
  .primary{background:var(--coral);color:#fff;box-shadow:0 4px 0 #D9492A}
  .secondary{background:var(--plum-soft);color:var(--plum)}
  .ghost{background:transparent;color:var(--muted);font-size:15px;padding:10px}
  .row{display:flex;gap:8px;flex-wrap:wrap}
  .chip{border:2px solid var(--line);background:#fff;border-radius:999px;padding:9px 14px;font:700 15px Nunito,sans-serif;cursor:pointer;color:var(--ink)}
  .chip.on{border-color:var(--coral);background:var(--coral-soft)}
  .chip.en.on{border-color:var(--plum);background:var(--plum-soft)}
  .chip.de.on{border-color:var(--teal);background:var(--teal-soft)}
  label.lbl{display:block;font-weight:800;font-size:14px;margin:14px 0 6px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
  input[type=text],textarea{width:100%;border:2px solid var(--line);border-radius:14px;padding:12px 14px;font:600 17px Nunito,sans-serif;color:var(--ink);background:#fff}
  input:focus,textarea:focus{outline:none;border-color:var(--coral)}
  .player{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line)}
  .player:last-child{border-bottom:none}
  .avatar{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font:700 18px Fredoka,system-ui,sans-serif;color:#fff;flex:none}
  .pname{font-weight:800}
  .pmeta{font-size:14px;color:var(--muted)}
  .x{margin-left:auto;background:none;border:none;font-size:22px;color:var(--muted);cursor:pointer;padding:4px 8px}
  .badge{display:inline-block;border-radius:999px;padding:4px 10px;font:800 12px Nunito,system-ui,sans-serif;letter-spacing:.05em;text-transform:uppercase}
  .b-en{background:var(--plum-soft);color:var(--plum)}
  .b-de{background:var(--teal-soft);color:#167B70}
  .b-fmt{background:var(--sun-soft);color:#8A5B00}
  .b-cat{background:var(--coral-soft);color:#B23A1E}
  .center{text-align:center}
  .big-name{font:700 44px Fredoka,system-ui,sans-serif;margin:8px 0}
  .handoff{flex:1;display:flex;flex-direction:column;justify-content:center;text-align:center}
  .emoji{font-size:56px}
  .prompt{font:600 23px Fredoka,Nunito,sans-serif;line-height:1.3;margin:12px 0}
  .task{background:var(--sun-soft);border-radius:14px;padding:12px 14px;font-weight:700;font-size:15px}
  .hints{display:none;margin-top:10px}
  .hints.show{display:block}
  .hint{display:inline-block;background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:6px 10px;margin:4px 4px 0 0;font-weight:700;font-size:15px}
  .timer{font:700 64px Fredoka,system-ui,sans-serif;text-align:center;margin:6px 0 0;font-variant-numeric:tabular-nums}
  .timer.low{color:var(--coral)}
  .bar{height:10px;background:var(--line);border-radius:999px;overflow:hidden}
  .bar>i{display:block;height:100%;background:var(--teal);width:100%;transition:width 1s linear}
  .bar.low>i{background:var(--coral)}
  .topline{display:flex;justify-content:space-between;align-items:center;font-weight:800;color:var(--muted);font-size:14px;margin-bottom:12px}
  .reacts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .react{border:2px solid var(--line);background:#fff;border-radius:16px;padding:12px 8px;cursor:pointer;text-align:center;font:700 15px Nunito,system-ui,sans-serif;color:var(--ink);position:relative}
  .react .e{font-size:30px;display:block}
  .react .n{position:absolute;top:6px;right:10px;font:700 16px Fredoka,system-ui,sans-serif;color:var(--coral)}
  .react.hit{border-color:var(--coral);background:var(--coral-soft)}
  .coach{background:var(--plum-soft);border-radius:16px;padding:14px;margin-top:14px}
  .rank{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px dashed var(--line)}
  .rank:last-child{border-bottom:none}
  .medal{font-size:28px;width:34px;text-align:center}
  .pts{margin-left:auto;font:700 22px Fredoka,system-ui,sans-serif;color:var(--coral)}
  .award{display:flex;gap:10px;align-items:center;padding:8px 0;font-weight:700}
  .award .e{font-size:26px}
  .tips{display:none;margin-top:8px;background:var(--bg);border-radius:12px;padding:10px 12px;font-size:15px}
  .tips.show{display:block}
  .faces{display:flex;justify-content:space-between;margin-top:8px}
  .face{font-size:34px;background:none;border:2px solid transparent;border-radius:14px;padding:6px 8px;cursor:pointer}
  .face.on{border-color:var(--coral);background:var(--coral-soft)}
  .logo{display:flex;gap:6px;justify-content:center;margin:10px 0 6px}
  .logo span{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font:700 22px Fredoka,system-ui,sans-serif;color:#fff}
  .stat{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--line)}
  .note{font-size:14px;color:var(--muted)}
  .stepper{display:flex;align-items:center;gap:12px}
  .step{width:56px;height:56px;border-radius:16px;border:2px solid var(--line);background:#fff;font:700 28px Fredoka,system-ui,sans-serif;color:var(--coral);cursor:pointer}
  .step:disabled{opacity:.35;cursor:default}
  .stepval{flex:1;text-align:center;background:var(--coral-soft);border-radius:16px;padding:8px}
  .stepval b{display:block;font:700 30px Fredoka,system-ui,sans-serif;color:var(--coral)}
  .stepval span{font-weight:700;font-size:14px;color:var(--muted)}
  .hidden{display:none !important}
  .err{color:var(--coral);font-weight:700;font-size:14px;min-height:18px;margin-top:6px}
</style>
</head>

const pick = a => a[Math.floor(Math.random()*a.length)];
function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }
function langBadge(l){ return l==="en" ? '<span class="badge b-en">🇬🇧 English</span>' : '<span class="badge b-de">🇩🇪 Deutsch</span>'; }

let audio=null;
function beep(){ try{ if(!audio) return; const o=audio.createOscillator(), g=audio.createGain(); o.connect(g); g.connect(audio.destination); o.frequency.value=880; g.gain.setValueAtTime(.2,audio.currentTime); g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.6); o.start(); o.stop(audio.currentTime+.6);}catch(e){} }
let wake=null;
async function keepAwake(){ try{ if('wakeLock' in navigator && !wake){ wake = await navigator.wakeLock.request('screen'); } }catch(e){} }

function choosePrompt(lang, level){
  const pool = level===0 ? P1 : P, tag = level===0 ? "a1" : "std";
  const fmtKeys = ["role","quick","wwyd"];
  const fmt = fmtKeys[(S.fmtCycle++) % 3];
  const cats = S.cat==="mix" ? shuffle(["everyday","social","work","travel"]) : [S.cat];
  const tryFind = (fmts) => {
    for(const c of cats){ for(const f of fmts){
      const list = pool[lang][c][f].map((x,i)=>({...x,c,f,id:`${lang}-${tag}-${c}-${f}-${i}`})).filter(x=>!S.used.has(x.id));
      if(list.length) return pick(list);
    }}
    return null;
  };
  let p = tryFind([fmt]) || tryFind(shuffle(fmtKeys.slice()));
  if(!p){ // everything used: reset this language
    [...S.used].filter(id=>id.startsWith(`${lang}-${tag}-`)).forEach(id=>S.used.delete(id));
    p = tryFind([fmt]);
  }
  S.used.add(p.id);
  return p;
}

function setDraft(k,v){ S.draft[k]=v; const n=$("pname"); if(n) S.draft.name=n.value; render(); }
function addPlayer(){
  const name=(($("pname")||{}).value||"").trim();
  if(!name){ S.err="Please type a name · Bitte Namen eingeben"; render(); return; }
  if(S.players.length>=10){ S.err="Max 10 players · Maximal 10 Spieler"; render(); return; }
  if(S.players.some(p=>p.name.toLowerCase()===name.toLowerCase())){ S.err="That name is taken · Name schon vergeben"; render(); return; }
  S.players.push({name,lang:S.draft.lang,level:S.draft.level,pts:0,reacts:{clear:0,creative:0,funny:0,learned:0},tips:[]});
  S.draft.name=""; S.err=""; render();
  const i=$("pname"); if(i) i.focus();
}
function removePlayer(i){ S.players.splice(i,1); render(); }
function toSettings(){ if(S.players.length<2){ S.err="Add at least 2 players · Mindestens 2 Spieler"; render(); return; } S.err=""; go("settings"); }
function setOpt(k,v){ S[k]=v; render(); }
function setRounds(d){ S.rounds=Math.min(10,Math.max(1,S.rounds+d)); render(); }
function resetScores(){ S.players.forEach(p=>{p.pts=0;p.reacts={clear:0,creative:0,funny:0,learned:0};p.tips=[];}); }

  try{ audio = audio || new (window.AudioContext||window.webkitAudioContext)(); }catch(e){}
  keepAwake();
  resetScores(); S.round=1; S.turn=0; S.rating=null; S.fmtCycle=Math.floor(Math.random()*3);
  bump("started"); go("handoff");
}
function showChallenge(){ keepAwake(); S.current=choosePrompt(S.players[S.turn].lang, S.players[S.turn].level); S.rerolled=false; go("challenge"); }
function reroll(){ S.current=choosePrompt(S.players[S.turn].lang, S.players[S.turn].level); S.rerolled=true; render(); }
function startTimer(){
  try{ if(audio && audio.state==="suspended") audio.resume(); }catch(e){}
  S.total = S.current.f==="quick" ? Math.round(S.time/2) : S.time; S.left=S.total;
  $("timerBox").classList.remove("hidden"); $("startBtn").classList.add("hidden"); $("doneBtn").classList.remove("hidden");
  const rb=$("rerollBtn"); if(rb) rb.classList.add("hidden");
  tick(); S.timerId=setInterval(()=>{ S.left--; tick(); if(S.left<=0){ stopTimer(true); } },1000);
}
function tick(){
  const m=Math.floor(Math.max(S.left,0)/60), s=Math.max(S.left,0)%60;
  const t=$("timer"); if(!t) return;
  t.textContent=`${m}:${String(s).padStart(2,"0")}`;
  const low=S.left<=10; t.classList.toggle("low",low); $("bar").classList.toggle("low",low);
  $("barFill").style.width=`${Math.max(S.left,0)/S.total*100}%`;
}
function stopTimer(ended){ if(S.timerId){ clearInterval(S.timerId); S.timerId=null; } if(ended){ beep(); const t=$("timer"); if(t) t.textContent="⏰ Time!"; } }
function finishTurn(){ stopTimer(false); S.turnReacts={clear:0,creative:0,funny:0,learned:0}; go("feedback"); }
function react(k){ S.turnReacts[k]++; render(); }
function resetReacts(){ S.turnReacts={clear:0,creative:0,funny:0,learned:0}; render(); }
function isLastTurn(){ return S.round===S.rounds && S.turn===S.players.length-1; }
function nextTurn(){
  const p=S.players[S.turn], tip=(($("tip")||{}).value||"").trim();
  if(tip) p.tips.push(tip);
  let gained=2; for(const k in S.turnReacts){ p.reacts[k]+=S.turnReacts[k]; gained+=S.turnReacts[k]; }
  p.pts+=gained;
  if(isLastTurn()){ bump("completed"); go("results"); return; }
  S.turn++; if(S.turn>=S.players.length){ S.turn=0; S.round++; }
  go("handoff");
}
function rate(n){ const first=S.rating===null; S.rating=n; const s=loadStats(); if(first) s.ratings.push(n); else s.ratings[s.ratings.length-1]=n; saveStats(s); render(); }
function playAgain(){ bump("replays"); startGame(); }
function newGame(){ S.players=[]; go("setup"); }
function confirmQuit(){
  const box=document.createElement("div");
  box.style.cssText="position:fixed;inset:0;background:rgba(43,33,64,.45);display:grid;place-items:center;padding:20px;z-index:9";
  box.innerHTML=`<div class="card" style="max-width:360px;width:100%"><h3>End this game?</h3><p class="note">Scores so far will be shown.</p>
    <button class="btn primary" id="qYes">Show results</button><button class="btn ghost" id="qNo">Keep playing</button></div>`;
  document.body.appendChild(box);
  $("qNo").onclick=()=>box.remove();
  $("qYes").onclick=()=>{ box.remove(); go("results"); };
}
function resetStats(){ saveStats({started:0,completed:0,replays:0,ratings:[]}); render(); }

render();
</script>
</body>
</html>
