  :root{
    --bg:#FFF6EC; --card:#FFFFFF; --ink:#2B2140; --muted:#6E6680;
    --coral:#FF6B4A; --coral-soft:#FFE3DB; --sun:#FFC145; --sun-soft:#FFF1CC;
    --teal:#20A99A; --teal-soft:#D6F3EF; --plum:#6C4AB6; --plum-soft:#E9E2F8;
    --line:#EADFD3; --radius:20px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
  /* keep decorative shapes from causing sideways scrolling, without trapping the page scroll */
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,sans-serif;font-size:17px;line-height:1.45;overscroll-behavior-y:none}
  button,.chip,.react,.face,.step{touch-action:manipulation;-webkit-user-select:none;user-select:none}
  body{-webkit-touch-callout:none}
  .wrap{overflow-x:hidden;overflow-x:clip;overflow-y:visible;max-width:560px;margin:0 auto;padding:calc(20px + env(safe-area-inset-top)) calc(18px + env(safe-area-inset-right)) calc(32px + env(safe-area-inset-bottom)) calc(18px + env(safe-area-inset-left));min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
  @media (max-width:360px){ h1{font-size:30px} .prompt{font-size:21px} .big-name{font-size:38px} .timer{font-size:56px} .chip{padding:8px 12px;font-size:14px} }
  h1,h2,h3{font-family:Fredoka,Nunito,sans-serif;margin:0 0 6px;line-height:1.15}
  h1{font-size:34px} h2{font-size:26px} h3{font-size:19px}
  .sub{color:var(--muted);margin:0 0 18px}
  .de{color:var(--muted);font-weight:600;font-size:.9em}
  .card{background:var(--card);border-radius:var(--radius);padding:18px;box-shadow:0 2px 0 var(--line);border:1.5px solid var(--line);margin-bottom:14px}
  .btn{display:block;width:100%;border:none;border-radius:16px;padding:16px 18px;font:700 18px Fredoka,Nunito,sans-serif;cursor:pointer;margin-top:10px;transition:transform .08s}
  .btn:active{transform:scale(.98)}
  .btn small{display:block;font:600 13px Nunito,sans-serif;opacity:.85;margin-top:2px}
  .primary{background:var(--coral);color:#fff;box-shadow:0 4px 0 #D9492A}
  .secondary{background:var(--plum-soft);color:var(--plum)}
  .ghost{background:transparent;color:var(--muted);font-size:15px;padding:10px}
  .row{display:flex;gap:8px;flex-wrap:wrap}
  .chip{border:2px solid var(--line);background:#fff;border-radius:999px;padding:9px 14px;font:700 15px Nunito,sans-serif;cursor:pointer;color:var(--ink)}
  .chip.on{border-color:var(--coral);background:var(--coral-soft)}
  .chip.en.on{border-color:var(--plum);background:var(--plum-soft)}
  .chip.de.on{border-color:var(--teal);background:var(--teal-soft)}
  label.lbl{display:block;font-weight:800;font-size:14px;margin:14px 0 6px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
  input[type=text],textarea{width:100%;border:2px solid var(--line);border-radius:14px;padding:12px 14px;font:600 17px Nunito,sans-serif;color:var(--ink);background:#fff}
  input:focus,textarea:focus{outline:none;border-color:var(--coral)}
  .player{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line)}
  .player:last-child{border-bottom:none}
  .avatar{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font:700 18px Fredoka,system-ui,sans-serif;color:#fff;flex:none}
  .pname{font-weight:800}
  .pmeta{font-size:14px;color:var(--muted)}
  .x{margin-left:auto;background:none;border:none;font-size:22px;color:var(--muted);cursor:pointer;padding:4px 8px}
  .badge{display:inline-block;border-radius:999px;padding:4px 10px;font:800 12px Nunito,system-ui,sans-serif;letter-spacing:.05em;text-transform:uppercase}
  .b-en{background:var(--plum-soft);color:var(--plum)}
  .b-de{background:var(--teal-soft);color:#167B70}
  .b-fmt{background:var(--sun-soft);color:#8A5B00}
  .b-cat{background:var(--coral-soft);color:#B23A1E}
  .center{text-align:center}
  .big-name{font:700 44px Fredoka,system-ui,sans-serif;margin:8px 0}
  .handoff{flex:1;display:flex;flex-direction:column;justify-content:center;text-align:center}
  .emoji{font-size:56px}
  .prompt{font:600 23px Fredoka,Nunito,sans-serif;line-height:1.3;margin:12px 0}
  .task{background:var(--sun-soft);border-radius:14px;padding:12px 14px;font-weight:700;font-size:15px}
  .hints{display:none;margin-top:10px}
  .hints.show{display:block}
  .hint{display:inline-block;background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:6px 10px;margin:4px 4px 0 0;font-weight:700;font-size:15px}
  .timer{font:700 64px Fredoka,system-ui,sans-serif;text-align:center;margin:6px 0 0;font-variant-numeric:tabular-nums}
  .timer.low{color:var(--coral)}
  .bar{height:10px;background:var(--line);border-radius:999px;overflow:hidden}
  .bar>i{display:block;height:100%;background:var(--teal);width:100%;transition:width 1s linear}
  .bar.low>i{background:var(--coral)}
  .topline{display:flex;justify-content:space-between;align-items:center;font-weight:800;color:var(--muted);font-size:14px;margin-bottom:12px}
  .reacts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .react{border:2px solid var(--line);background:#fff;border-radius:16px;padding:12px 8px;cursor:pointer;text-align:center;font:700 15px Nunito,system-ui,sans-serif;color:var(--ink);position:relative}
  .react .e{font-size:30px;display:block}
  .react .n{position:absolute;top:6px;right:10px;font:700 16px Fredoka,system-ui,sans-serif;color:var(--coral)}
  .react.hit{border-color:var(--coral);background:var(--coral-soft)}
  .coach{background:var(--plum-soft);border-radius:16px;padding:14px;margin-top:14px}
  .rank{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px dashed var(--line)}
  .rank:last-child{border-bottom:none}
  .medal{font-size:28px;width:34px;text-align:center}
  .pts{margin-left:auto;font:700 22px Fredoka,system-ui,sans-serif;color:var(--coral)}
  .award{display:flex;gap:10px;align-items:center;padding:8px 0;font-weight:700}
  .award .e{font-size:26px}
  .tips{display:none;margin-top:8px;background:var(--bg);border-radius:12px;padding:10px 12px;font-size:15px}
  .tips.show{display:block}
  .faces{display:flex;justify-content:space-between;margin-top:8px}
  .face{font-size:34px;background:none;border:2px solid transparent;border-radius:14px;padding:6px 8px;cursor:pointer}
  .face.on{border-color:var(--coral);background:var(--coral-soft)}
  .logo{display:flex;gap:6px;justify-content:center;margin:10px 0 6px}
  .logo span{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font:700 22px Fredoka,system-ui,sans-serif;color:#fff}
  .stat{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--line)}
  .note{font-size:14px;color:var(--muted)}
  .stepper{display:flex;align-items:center;gap:12px}
  .step{width:56px;height:56px;border-radius:16px;border:2px solid var(--line);background:#fff;font:700 28px Fredoka,system-ui,sans-serif;color:var(--coral);cursor:pointer}
  .step:disabled{opacity:.35;cursor:default}
  .stepval{flex:1;text-align:center;background:var(--coral-soft);border-radius:16px;padding:8px}
  .stepval b{display:block;font:700 30px Fredoka,system-ui,sans-serif;color:var(--coral)}
  .stepval span{font-weight:700;font-size:14px;color:var(--muted)}
  .powered{display:block;text-align:center;text-decoration:none;color:var(--muted);margin-top:22px;padding:12px 14px;border-top:1.5px dashed var(--line)}
  .powered .pw-top{display:block;font-weight:700;font-size:14px}
  .powered .pw-top b{color:var(--plum);font-family:Fredoka,system-ui,sans-serif;font-size:16px}
  .powered .pw-sub{display:block;font-size:12.5px;margin-top:2px}
  .powered u{color:var(--coral);font-weight:700}
  .beta{display:inline-block;vertical-align:middle;background:var(--sun);color:#5A3B00;font:700 13px Nunito,system-ui,sans-serif;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:999px;position:relative;top:-4px}
  .beta-note{display:block;font-size:12px;margin-top:8px;color:var(--muted)}
  .hero{position:relative;text-align:center;padding:8px 0 4px;margin-bottom:6px}
  .blob{position:absolute;border-radius:50%;filter:blur(36px);opacity:.55;z-index:-1}
  .b1{width:220px;height:220px;background:#FFC9B8;top:-40px;left:-60px}
  .b2{width:200px;height:200px;background:#E2D6FA;top:20px;right:-70px}
  .b3{width:160px;height:160px;background:#C9F0EA;top:200px;left:30%}
  .hero-icon{width:112px;height:112px;margin:6px auto 12px;filter:drop-shadow(0 10px 18px rgba(255,107,74,.35));animation:float 3.5s ease-in-out infinite}
  .hero-icon svg{width:100%;height:100%;display:block}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  @media (prefers-reduced-motion:reduce){.hero-icon{animation:none}}
  .brand{font-size:40px;margin-bottom:2px}
  .tagline{font:600 20px Fredoka,system-ui,sans-serif;color:var(--coral);margin:0 0 6px}
  .feats{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
  .feat{background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:6px 10px;font-weight:800;font-size:13px}
  .big-cta{font-size:22px;padding:18px;margin:18px 0 16px}
  .peek{background:#fff;border:2px dashed var(--plum);border-radius:var(--radius);padding:14px 16px;cursor:pointer;transform:rotate(-1deg);margin:4px 2px 20px}
  .peek-top{display:flex;gap:6px;flex-wrap:wrap}
  .peek-q{font:600 18px Fredoka,system-ui,sans-serif;margin:10px 0 8px;line-height:1.3}
  .peek-foot{font-size:12.5px;color:var(--muted);font-weight:700}
  .howto-title{margin:0 0 10px}
  .steps{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .stepcard{border-radius:18px;padding:14px 12px;display:flex;flex-direction:column;gap:2px}
  .stepcard .se{font-size:28px}
  .stepcard b{font:700 18px Fredoka,system-ui,sans-serif}
  .stepcard span:last-child{font-size:14px;color:var(--muted);font-weight:700}
  .c1{background:var(--plum-soft)} .c2{background:var(--sun-soft)} .c3{background:var(--coral-soft)} .c4{background:var(--teal-soft)}
  .sheet-bg{position:fixed;inset:0;background:rgba(43,33,64,.5);display:flex;align-items:flex-end;justify-content:center;z-index:20}
  .sheet{background:var(--bg);width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
  .sheet textarea{font-size:14px;font-weight:600;line-height:1.4}
  .exgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:2px}
  .exb{text-align:center;text-decoration:none;font-size:16px;padding:14px 10px;margin-top:8px}
  .coach-score{margin-top:6px;background:var(--sun-soft)}
  .coach-score.need{outline:3px solid var(--coral)}
  .ratings{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .rate{position:relative;border:2px solid var(--line);background:#fff;border-radius:16px;padding:10px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;color:var(--ink);font-family:Nunito,system-ui,sans-serif}
  .rate .e{font-size:26px} .rate b{font-size:15px} .rate .de{font-size:12px}
  .rate .rp{position:absolute;top:6px;right:9px;font:700 13px Fredoka,system-ui,sans-serif;color:var(--muted)}
  .rate.on{border-color:var(--coral);background:var(--coral-soft);box-shadow:0 3px 0 #D9492A}
  .rate.on .rp{color:var(--coral)}
  .hintbtn{border-color:var(--plum);background:var(--plum-soft)}
  .bonusbox{background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:14px;margin-top:14px}
  .bonus{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;border:2px solid var(--line);background:#fff;border-radius:14px;padding:10px 12px;margin-top:8px;font:600 15px Nunito,system-ui,sans-serif;color:var(--ink)}
  button.bonus{cursor:pointer} button.bonus:disabled{cursor:default}
  .bonus.got{border-color:var(--teal);background:var(--teal-soft)}
  .bonus.off{opacity:.6}
  .bonus .bp{font:700 18px Fredoka,system-ui,sans-serif;color:var(--teal);flex:none}
  .bonus.off .bp{color:var(--muted)}
  .chip.lang.on{border-color:var(--coral);background:var(--coral-soft)}
  .flagrow{display:flex;justify-content:center;gap:8px;font-size:22px;margin-top:10px}
  [dir=rtl] .prompt,[dir=rtl] .peek-q{font-family:"Noto Naskh Arabic","Geeza Pro","Segoe UI",Tahoma,sans-serif;line-height:1.6}
  .big-cta2{font-size:19px;padding:16px;margin:-6px 0 16px}
  .roomcode{font:700 54px Fredoka,system-ui,sans-serif;letter-spacing:.18em;color:var(--coral);margin:2px 0}
  .obanner{background:var(--sun-soft);border-radius:14px;padding:10px 12px;font-weight:700;font-size:14px;margin-bottom:12px}
  .obanner.bad{background:var(--coral-soft);color:#9A2E16}
  .dot{width:12px;height:12px;border-radius:50%;background:#C9C2D6;margin-left:auto;flex:none}
  .dot.on{background:var(--teal);box-shadow:0 0 0 4px var(--teal-soft)}
  .player .x{margin-left:6px}
  .or{text-align:center;color:var(--muted);font-weight:700;margin:14px 0 4px}
  .turnwho{display:flex;gap:12px;align-items:center;margin-bottom:12px}
  .turnwho .avatar{width:48px;height:48px;font-size:22px}
  .resume{background:var(--teal-soft);border-color:var(--teal)}
  .react:disabled,.rate:disabled{cursor:default;opacity:.85}
  .reqcard{border-color:var(--plum);background:var(--plum-soft)}
  .reqcard .chip.on{border-color:var(--teal);background:var(--teal-soft)}
  .timerrow{display:flex;align-items:center;justify-content:center;gap:10px;position:relative}
  .timerrow .soundbtn{position:absolute;right:0;font-size:18px}
  .cemoji{font-size:64px;line-height:1.1}
  .cword{font:700 34px Fredoka,system-ui,sans-serif;margin:4px 0;line-height:1.15}
  .cardword{border:3px solid var(--coral)}
  .cguessers{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .cg{display:flex;align-items:center;gap:10px;background:var(--teal-soft);border:2px solid var(--teal);border-radius:16px;padding:12px;font:600 15px Nunito,system-ui,sans-serif;color:#0F5F56;cursor:pointer;text-align:left;box-shadow:0 3px 0 #178A7D}
  .cg b{font-weight:800;color:#0B4A43} .cg:active{transform:translateY(2px);box-shadow:0 1px 0 #178A7D}
  .cgck{flex:none;width:30px;height:30px;border-radius:50%;background:var(--teal);color:#fff;display:grid;place-items:center;font-weight:800;font-size:17px}
  .cgde{font-size:12px;opacity:.8}
  .cline{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px dashed var(--line)} .cline:last-child{border-bottom:none}
  .cemo{font-size:30px;line-height:1.2}
  .clue{min-height:52px;font-size:34px;letter-spacing:4px;text-align:center;background:#fff;border:2px dashed var(--plum);border-radius:16px;padding:8px;line-height:1.3;word-break:break-all}

  .clue .note{letter-spacing:normal;font-size:14px;line-height:1.4;display:inline-block;padding-top:8px}

  .ekeys button{font-size:26px;background:none;border:none;padding:6px 0;border-radius:10px;cursor:pointer;touch-action:manipulation}
  .ekeys button:active{background:var(--plum-soft)}
  .feed{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:8px 12px;margin-top:10px;font-size:15px}

function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }

let audio=null;
function soundOn(){ try{ return localStorage.getItem("pt_sound")!=="off"; }catch(e){ return true; } }
function ensureAudio(){ try{ if(!audio) audio=new (window.AudioContext||window.webkitAudioContext)(); if(audio.state==="suspended") audio.resume(); }catch(e){} }
document.addEventListener("pointerdown", ensureAudio, {passive:true}); // phones only allow sound after a tap
function tone(freq, dur, vol, type){
  try{ if(!audio || !soundOn()) return; const t0=audio.currentTime, o=audio.createOscillator(), g=audio.createGain();
    o.type=type||"sine"; o.frequency.value=freq; o.connect(g); g.connect(audio.destination);
    g.gain.setValueAtTime(0.0001,t0); g.gain.exponentialRampToValueAtTime(vol,t0+0.01); g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    o.start(t0); o.stop(t0+dur+0.02); }catch(e){}
}
// Last 10 seconds: soft ticks, then three rising beeps for 3-2-1.
function countdownSound(n){ if(n>3) tone(1050, 0.07, 0.12, "triangle"); else tone(n===3?660:n===2?740:830, 0.18, 0.22, "sine"); }
function toggleSound(){ try{ localStorage.setItem("pt_sound", soundOn()?"off":"on"); }catch(e){} ensureAudio(); document.querySelectorAll(".soundbtn").forEach(b=>b.textContent=soundOn()?"🔊":"🔇"); }
function soundBtn(){ return `<button class="chip soundbtn" onclick="toggleSound()" aria-label="Sound on/off">${soundOn()?"🔊":"🔇"}</button>`; }
function beep(){ if(!soundOn()) return; tone(880,0.25,0.25,"sine"); setTimeout(()=>tone(1175,0.5,0.25,"sine"),180); }
function beepOld(){ try{ if(!audio) return; const o=audio.createOscillator(), g=audio.createGain(); o.connect(g); g.connect(audio.destination); o.frequency.value=880; g.gain.setValueAtTime(.2,audio.currentTime); g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.6); o.start(); o.stop(audio.currentTime+.6);}catch(e){} }
let wake=null;
async function keepAwake(){ try{ if('wakeLock' in navigator && !wake){ wake = await navigator.wakeLock.request('screen'); } }catch(e){} }

function nextPrompt(p){ return p.level===4 ? a0Prompt(p) : choosePrompt(p.lang, p.level); }
function choosePrompt(lang, level){
  const pool = level===0 ? P1 : P, tag = level===0 ? "a1" : "std";
  const fmtKeys = ["role","quick","wwyd"];
  const fmt = fmtKeys[(S.fmtCycle++) % 3];
  const cats = S.cat==="mix" ? shuffle(["everyday","social","work","travel"]) : [S.cat];
  const tryFind = (fmts) => {
    for(const c of cats){ for(const f of fmts){
      const list = pool[lang][c][f].map((x,i)=>({...x,c,f,id:`${lang}-${tag}-${c}-${f}-${i}`})).filter(x=>!S.used.has(x.id));
      if(list.length) return pick(list);
    }}
    return null;
  };
  let p = tryFind([fmt]) || tryFind(shuffle(fmtKeys.slice()));
  if(!p){ // everything used: reset this language
    [...S.used].filter(id=>id.startsWith(`${lang}-${tag}-`)).forEach(id=>S.used.delete(id));
    p = tryFind([fmt]);
  }
  S.used.add(p.id);
  return p;
}

const AFTER = {

/* ===================== ACTIONS ===================== */
function setDraft(k,v){ S.draft[k]=v; const n=$("pname"); if(n) S.draft.name=n.value; render(); }
function addPlayer(){
  const name=(($("pname")||{}).value||"").trim();
  if(!name){ S.err="Please type a name · Bitte Namen eingeben"; render(); return; }
  if(S.players.length>=10){ S.err="Max 10 players · Maximal 10 Spieler"; render(); return; }
  if(S.players.some(p=>p.name.toLowerCase()===name.toLowerCase())){ S.err="That name is taken · Name schon vergeben"; render(); return; }
  S.players.push({name,lang:S.draft.lang,level:S.draft.level,pts:0,reacts:{clear:0,creative:0,funny:0,learned:0},tips:[]});
  S.draft.name=""; S.err=""; render();
  const i=$("pname"); if(i) i.focus();
}
function removePlayer(i){ S.players.splice(i,1); render(); }
function toSettings(){ if(S.players.length<2){ S.err="Add at least 2 players · Mindestens 2 Spieler"; render(); return; } S.err=""; go("settings"); }
function setOpt(k,v){ S[k]=v; render(); }
function setRounds(d){ S.rounds=Math.min(10,Math.max(1,S.rounds+d)); render(); }
function resetScores(){ S.players.forEach(p=>{p.pts=0;p.coach=0;p.bonus=0;p.cact=0;p.cguess=0;p.ratings=[];p.reacts={clear:0,creative:0,funny:0,learned:0};p.tips=[];}); }
function startGame(){
  try{ audio = audio || new (window.AudioContext||window.webkitAudioContext)(); }catch(e){}
  keepAwake();
  resetScores(); S.gid=uid(); S.savedIdx=null; S.log=[]; S.round=1; S.turn=0; S.rating=null; S.fmtCycle=Math.floor(Math.random()*3);
  if(S.game==="charades"){ cStartGame(); return; }
  bump("started"); go("handoff");
}
function showChallenge(){ keepAwake(); S.current=nextPrompt(S.players[S.turn]); S.rerolled=false; S.hintsUsed=false; S.timeUp=false; go("challenge"); }
function reroll(){ S.current=nextPrompt(S.players[S.turn]); S.rerolled=true; S.hintsUsed=false; render(); }
function openHints(){
  S.hintsUsed=true;
  const h=$("hints"); if(h) h.classList.add("show");
  const btn=document.querySelector(".hintbtn"); if(btn){ btn.classList.remove("hintbtn"); const n=btn.nextElementSibling; if(n && n.classList.contains("note")) n.remove(); }
}
function startTimer(){
  try{ if(audio && audio.state==="suspended") audio.resume(); }catch(e){}
  S.total = S.current.f==="quick" ? Math.round(S.time/2) : S.time; S.left=S.total; S.lastCount=null;
  $("timerBox").classList.remove("hidden"); $("startBtn").classList.add("hidden"); $("doneBtn").classList.remove("hidden");
  const rb=$("rerollBtn"); if(rb) rb.classList.add("hidden");
  tick(); S.timerId=setInterval(()=>{ S.left--; tick(); if(S.left<=0){ stopTimer(true); } },1000);
}
function tick(){
  const m=Math.floor(Math.max(S.left,0)/60), s=Math.max(S.left,0)%60;
  const t=$("timer"); if(!t) return;
  t.textContent=`${m}:${String(s).padStart(2,"0")}`;
  const low=S.left<=10; t.classList.toggle("low",low); $("bar").classList.toggle("low",low);
  if(S.left>0 && S.left<=10 && S.lastCount!==S.left){ S.lastCount=S.left; countdownSound(S.left); }
  $("barFill").style.width=`${Math.max(S.left,0)/S.total*100}%`;
}
function stopTimer(ended){ if(S.timerId){ clearInterval(S.timerId); S.timerId=null; } if(ended){ S.timeUp=true; beep(); const t=$("timer"); if(t) t.textContent="⏰ Time!"; const d=$("doneBtn"); if(d) d.innerHTML="✓ Time's up – feedback<small>Zeit um – Feedback</small>"; } }
function finishTurn(){ stopTimer(false); S.turnReacts={clear:0,creative:0,funny:0,learned:0}; S.turnRating=0; S.turnAns=""; S.turnTip=""; S.needRating=false; S.keptTalking=!!S.timeUp; go("feedback"); }
function toggleKept(){ if(!S.timeUp) return; S.keptTalking=!S.keptTalking; const y=window.scrollY; render(); window.scrollTo(0,y); }
function turnBonus(){ const b=[]; if(!S.hintsUsed) b.push({k:"nohints",e:"🙈",en:"No hints",de:"Ohne Hilfe",pts:2}); if(S.timeUp && S.keptTalking) b.push({k:"kept",e:"🎤",en:"Kept talking",de:"Bis zum Ende gesprochen",pts:2}); return b; }
function setRating(v){ S.turnRating=v; S.needRating=false; const y=window.scrollY; render(); window.scrollTo(0,y); }
function react(k){ S.turnReacts[k]++; const y=window.scrollY; render(); window.scrollTo(0,y); }
function resetReacts(){ S.turnReacts={clear:0,creative:0,funny:0,learned:0}; render(); }
function isLastTurn(){ return S.round===S.rounds && S.turn===S.players.length-1; }
function nextTurn(){
  if(!S.turnRating){ S.needRating=true; render(); window.scrollTo({top:0,behavior:"smooth"}); return; }
  const p=S.players[S.turn], tip=(S.turnTip||"").trim(), ans=(S.turnAns||"").trim();
  const R=RATINGS.find(r=>r.v===S.turnRating);
  if(tip) p.tips.push(tip);
  const bonus=turnBonus();
  S.log.push({pi:S.turn, round:S.round, q:S.current.t, qr:S.current.r||"", f:S.current.f, c:S.current.c, words:S.current.w.slice(), wr:(S.current.wr||[]).slice(), ans, tip, rating:R.v, bonus:bonus.map(b=>b.k), reacts:{...S.turnReacts}});
  p.coach+=R.pts; p.ratings.push(R.v);
  p.bonus=(p.bonus||0)+bonus.reduce((a,b)=>a+b.pts,0);
  let gained=R.pts+bonus.reduce((a,b)=>a+b.pts,0); for(const k in S.turnReacts){ p.reacts[k]+=S.turnReacts[k]; gained+=S.turnReacts[k]; }
  p.pts+=gained;
  if(isLastTurn()){ bump("completed"); go("results"); return; }
  S.turn++; if(S.turn>=S.players.length){ S.turn=0; S.round++; }
  go("handoff");
}
/* ===================== EXPORT / SHARE ===================== */
function appLink(){ try{ return location.protocol.startsWith("http") ? location.origin : "pontetalk.setzio.com"; }catch(e){ return "pontetalk.setzio.com"; } }
function today(){ const d=new Date(); return `${String(d.getDate()).padStart(2,"0")}.${String(d.getMonth()+1).padStart(2,"0")}.${d.getFullYear()}`; }
function reactLine(r){ return REACTS.filter(x=>r[x.k]).map(x=>`${x.e}${r[x.k]}`).join("  ") || "–"; }
function playerReview(i, ctx){
  ctx=ctx||{players:S.players, log:S.log, rounds:S.rounds, clog:S.clog};
  const p=ctx.players[i], L=p.lang, X=T[L], R=X.r, turns=ctx.log.filter(t=>t.pi===i);
  let out=`🌉 PonteTalk – ${R.title}\n`;
  out+=`${today()} · ${p.name} · ${X.flag} ${X.name} ${LEVELS[p.level].code}\n`;
  out+=`${R.points}: ${p.pts}\n\n`;
  if(!turns.length && !(ctx.clog||[]).length) out+=R.none+"\n";
  turns.forEach((x,n)=>{
    const a1 = p.level===0 && x.f==="wwyd";
    out+=`${n+1}) ${FMTS[x.f].e} ${a1?X.a1wwyd:X.fmt[x.f]} · ${CATS[x.c].e} ${X.cats[x.c]}\n`;
    out+=`❓ ${x.q}\n`; if(x.qr) out+=`   (${x.qr})\n`;
    if(x.rating){ out+=`🧑‍🏫 ${R.coach}: ${RATINGS[x.rating-1].e} ${X.ratings[x.rating-1]}\n`; }
    if(x.bonus && x.bonus.length) out+=`🎁 ${R.bonus}: ${x.bonus.map(k=>k==="nohints"?`🙈 ${R.nohints}`:`🎤 ${R.kept}`).join(", ")}\n`;
    if(x.ans) out+=`✍️ ${R.said}: ${x.ans}\n`;
    if(x.tip) out+=`💡 ${R.tip}: ${x.tip}\n`;
    out+=`📚 ${R.words}: ${x.words.map((w,k)=>(x.wr&&x.wr[k])?`${w} (${x.wr[k]})`:w).join(", ")}\n`;
    out+=`👏 ${R.reacts}: ${reactLine(x.reacts)}\n\n`;
  });
  out+=charadesReview(i, ctx);
  if(turns.length) out+=`🎯 ${R.practice}\n\n`;
  out+=`${R.again}: ${appLink()}`;
  return out;
}
function gameReview(ctx){
  ctx=ctx||{players:S.players, log:S.log, rounds:S.rounds, clog:S.clog};
  let out=`🌉 PonteTalk – Game summary · Spielübersicht\n${today()} · ${ctx.players.length} players · ${ctx.rounds} round(s)\n\n`;
  const ranked=ctx.players.map((p,i)=>({p,i})).sort((a,b)=>b.p.pts-a.p.pts);
  out+=`🏆 Scores\n`+ranked.map((r,n)=>`${n+1}. ${r.p.name} (${T[r.p.lang].code} ${LEVELS[r.p.level].code}) – ${r.p.pts}`).join("\n")+"\n\n";
  ctx.players.forEach((p,i)=>{
    out+=`━━━━━━━━━━\n👤 ${p.name}\n`;
    if((ctx.clog||[]).length) out+=`   🎭 acted ${p.cact||0} · 🧠 guessed ${p.cguess||0}\n`;

function makeTransport(code, me, h){

      if(d._bye){ delete seen[d._bye]; h.onPresence(Object.values(seen)); return; }
      h.onMsg(d);
    };
    seen[me.id]={...me,t:Date.now()};
    const iv = setInterval(()=>{ beat(); const now=Date.now(); let ch=false;
      for(const k in seen){ if(k!==me.id && now-seen[k].t>6000){ delete seen[k]; ch=true; } }

function applyAction(from, a){
  const G=O.G; if(!G || !a) return;
  const active = G.players[G.turn] || {}, isActive = from===active.id, isHost = from===G.hostId, tp=G.tp;

    case "decline": if(isHost && G.pending){ G.pending=G.pending.filter(x=>x.id!==a.id); G.declined=[...(G.declined||[]), a.id]; } break;

        if(a.game){ G.game=a.game; if(a.game==="charades" && G.time>90) G.time=60; if(a.game!=="charades" && G.time<60) G.time=90; }
        if(a.cdiff!==undefined) G.cdiff=a.cdiff;
        if(a.cmode) G.cmode=a.cmode; } break;
    case "start": if(isHost && (G.phase==="lobby"||G.phase==="results") && G.players.length>=2) oStart(); break;
    case "lobby": if(isHost){ G.phase="lobby"; G.tp=null; } break;
    case "kick": if(isHost && G.phase==="lobby" && a.id!==G.hostId){ G.players=G.players.filter(p=>p.id!==a.id); G.declined=[...(G.declined||[]), a.id]; } break;
    case "hint": if(G.phase==="turn" && isActive) tp.hintsUsed=true; break;
    case "reroll": if(G.phase==="turn" && isActive && !tp.rerolled && !tp.timer){ G.current=active.level===4 ? a0Prompt(active) : oPick(active.lang, active.level); tp.rerolled=true; tp.hintsUsed=false; } break;
    case "timer": if(G.phase==="turn" && (isActive||isHost) && !tp.timer){

      } break;
    case "done": if(G.phase==="turn" && (isActive||isHost)){ if(O.hostTimeout){ clearTimeout(O.hostTimeout); O.hostTimeout=null; } G.phase="feedback"; } break;
    case "skip": if(isHost && (G.phase==="turn"||G.phase==="feedback"||G.phase==="cturn"||G.phase==="csum")){ if(O.hostTimeout){ clearTimeout(O.hostTimeout); O.hostTimeout=null; } oAdvance(); } break;

    case "rate": if(G.phase==="feedback" && (!isActive||isHost) && RATINGS.some(r=>r.v===a.v)){ tp.rating=a.v; tp.ratedBy=from; } break;
    case "kept": if(G.phase==="feedback" && !isActive && tp.timeUp) tp.kept=!tp.kept; break;
    case "note": if(G.phase==="feedback" && a.text && String(a.text).trim()){ const by=(G.players.find(p=>p.id===from)||{}).name||"?"; tp.notes.push({type:a.note==="ans"?"ans":"tip", text:String(a.text).trim().slice(0,300), by}); } break;
    case "next": if(G.phase==="feedback" && (!isActive||isHost) && tp.rating){ oScore(); oAdvance(); } break;
    default: return;
  }
  pushState();
}

  if(left>0 && left<=10 && timed && O.lastCount!==left+"|"+t.id){ O.lastCount=left+"|"+t.id; countdownSound(left); }
  if(!el) return;
  el.textContent = left===0 ? "⏰ Time!" : `${Math.floor(left/60)}:${String(left%60).padStart(2,"0")}`;
  el.classList.toggle("low", left<=10);
  const bar=$("obar"), fill=$("obarFill"); if(bar){ bar.classList.toggle("low", left<=10); fill.style.width = `${left/t.total*100}%`; }
}

function oCtx(){ return {players:O.G.players, log:O.G.log||[], rounds:O.G.rounds, clog:O.G.clog||[]}; }
function oRate(n){ const first=O.rating===null; O.rating=n; const s=loadStats(); if(first) s.ratings.push(n); else s.ratings[s.ratings.length-1]=n; saveStats(s); renderOnline(true); }

/* ---------- small helpers ---------- */
async function shareRoom(){
  const text=`Join my PonteTalk game 🌉 Code: ${O.code}\n${roomLink()}`;
  try{ if(navigator.share){ await navigator.share({title:"PonteTalk", text}); return; } }catch(e){ return; }
  location.href = "https://wa.me/?text="+encodeURIComponent(text);
}
async function copyRoom(){
  const m=$("roomMsg");
  try{ await navigator.clipboard.writeText(roomLink()); if(m) m.textContent="Link copied! · Kopiert!"; }
  catch(e){ if(m) m.textContent=roomLink(); }
}
function confirmLeave(){
  const box=document.createElement("div");
  box.style.cssText="position:fixed;inset:0;background:rgba(43,33,64,.45);display:grid;place-items:center;padding:20px;z-index:9";
  box.innerHTML=`<div class="card" style="max-width:360px;width:100%"><h3>Leave this game?</h3><p class="note">${O.role==="host"?"You're the host — the game stops for everyone.":"You can rejoin with the same code."}</p>
    <button class="btn primary" id="lYes">Leave · Verlassen</button><button class="btn ghost" id="lNo">Stay · Bleiben</button></div>`;
  document.body.appendChild(box);
  $("lNo").onclick=()=>box.remove(); $("lYes").onclick=()=>{ box.remove(); onlineLeave(); };
}
function hostMenu(){
  const box=document.createElement("div");
  box.className="sheet-bg";
  box.innerHTML=`<div class="sheet"><div class="topline"><h3 style="margin:0">⚙️ Host</h3><button class="chip" id="hmX">✕</button></div>
    <button class="btn secondary" id="hmSkip">⏭️ Skip this turn<small>No points · Ohne Punkte</small></button>
    <button class="btn secondary" id="hmEnd">🏁 End game now<small>Show results · Ergebnisse zeigen</small></button>
    <button class="btn ghost" id="hmLobby">👥 Back to lobby</button></div>`;
  document.body.appendChild(box);
  const close=()=>box.remove();
  $("hmX").onclick=close; box.addEventListener("click",e=>{ if(e.target===box) close(); });
  $("hmSkip").onclick=()=>{ close(); act({type:"skip"}); };
  $("hmEnd").onclick=()=>{ close(); if(O.hostTimeout){ clearTimeout(O.hostTimeout); O.hostTimeout=null; } O.G.phase="results"; O.G.tp=null; bump("completed"); pushState(); };
  $("hmLobby").onclick=()=>{ close(); act({type:"lobby"}); };
}

/* ---------- render glue ---------- */
function renderOnline(force){
  if(S.screen!=="lobby") return;
  const G=O.G;
  renderChat();
  // During feedback, update only the live part so typing in the note boxes isn't interrupted.
  const key = G ? `${G.phase}|${G.round}|${G.turn}|${(G.pending||[]).length}|${G.locked?1:0}|${oOutsider()?1:0}` : "none";
  if(!force && G && G.phase==="feedback" && O.viewKey===key && $("odyn")){
    const y=window.scrollY; $("odyn").innerHTML=oFeedbackDyn(); if($("odyn2")) $("odyn2").innerHTML=oFeedbackDyn2(); window.scrollTo(0,y); return;
  }
  const turnKey = G ? `${G.phase}|${G.round}|${G.turn}` : "none";
  if(O.turnKey!==turnKey){ O.turnKey=turnKey; O.draftAns=""; O.draftTip=""; O.sentNote=""; if(G && G.phase!=="results") O.rating=null; }
  const sameView = (O.viewKey||"").split("|").slice(0,3).join("|")===turnKey, y=window.scrollY;
  O.viewKey=key;
  const keep={}; document.querySelectorAll("[data-keep]").forEach(el=>{ keep[el.id]={v:el.value, f:document.activeElement===el, s:el.selectionStart}; });
  $("app").innerHTML = VIEWS.lobby();
  for(const id in keep){ const el=$(id); if(el){ el.value=keep[id].v; if(keep[id].f){ el.focus({preventScroll:true}); try{ el.setSelectionRange(keep[id].s,keep[id].s); }catch(e){} } } }
  if(sameView) window.scrollTo(0,y); else window.scrollTo(0,0);
  if(G && G.tp && G.tp.timer) onlineTick();
}
// Re-check the host connection banner every few seconds.
setInterval(()=>{ if(S.screen==="lobby" && O.role==="guest") renderOnline(); }, 4000);
// Open the join screen straight from an invite link (?join=CODE).
(function(){ try{ const c=new URLSearchParams(location.search).get("join"); if(c){ O.codeInput=c.toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,4); S.screen="online"; } }catch(e){} })();

    const id = others.length ? others[others.length-1] : learned[learned.length-1];
    st.lastSent=id;
    const it=a0Item(id,L), fr=A0_FRAME[L]||A0_FRAME.en;
    const t=fr[0].replace("{w}", it.w), r=(fr[1] && it.r) ? fr[1].replace("{r}", it.r) : "";
    return {f:"a0sent", c:"everyday", id:`${L}-a0-s-${id}-${st.n}`, t:`${it.e}  ${t}`, r, w:[it.w, ...meaning(it)], wr:[it.r]};
  }
  const id=fresh(), it=a0Item(id,L);
  return {f:"a0new", c:"everyday", id:`${L}-a0-n-${id}-${st.n}`, t:`${it.e}  ${it.w}`, r:it.r, w:meaning(it), wr:[]};
}

function cPick(diff, used){
  let pool = CW.map((x,i)=>i).filter(i => diff==="mix" || CW[i][1]===diff);
  let free = pool.filter(i=>!used.includes(i));
  if(!free.length){ used.splice(0, used.length, ...used.filter(i=>!pool.includes(i))); free=pool.slice(); }
  const i = pick(free); used.push(i); return i;
}
function cAnswerChips(i, langs){
  return langs.map(l=>`<span class="hint" dir="${T[l].dir}" lang="${l}">${T[l].flag} ${esc(cWord(i,l))}${romP(cRoman(i,l))}</span>`).join("");
}
function cGuesserLangs(players, actorIdx){ return [...new Set(players.filter((p,j)=>j!==actorIdx).map(p=>p.lang))]; }
function cDiffChips(cur, players, onclickFn){
  const auto = cAutoDiff(players);
  return `<div class="row">
    <button class="chip ${cur==="auto"?"on":""}" onclick="${onclickFn}('auto')">✨ Auto · ${CDIFF[auto].e} ${CDIFF[auto].en}</button>
    ${CDIFF.map(d=>`<button class="chip ${cur===d.k?"on":""}" onclick="${onclickFn}(${typeof d.k==="string"?`'${d.k}'`:d.k})">${d.e} ${d.en} · ${d.de}</button>`).join("")}</div>
    <p class="note" style="margin:6px 0 0">${cur==="auto"?`Picked from the lowest level at the table · nach dem niedrigsten Niveau`:esc((CDIFF.find(d=>d.k===cur)||{}).hint||"")}</p>`;
}
function gameChips(cur, fn){

}

function cGuess(i){

function cSkip(){

function charadesAwards(players){
  const best=k=>players.map((p,i)=>({p,i})).sort((a,b)=>(b.p[k]||0)-(a.p[k]||0))[0];
  const row=(k,e,en,de)=>{ const b=best(k); if(!b||!(b.p[k])) return ""; return `<div class="award"><span class="e">${e}</span><div>${en} <span class="de">· ${de}</span><br><span style="color:${COLORS[b.i%COLORS.length]}">${esc(b.p.name)}</span> <span class="note">(${b.p[k]})</span></div></div>`; };
  return row("cact","🎭","Best actor","Beste/r Schauspieler/in")+row("cguess","🧠","Best guesser","Beste/r Rater/in");
}
function charadesReview(i, ctx){
  const p=ctx.players[i], L=p.lang, items=(ctx.clog||[]).filter(x=>x.actor===i||x.by===i);
  if(!items.length) return "";
  const seen=new Set(); let out=`🎭 Charades\n`;
  items.forEach(x=>{ if(seen.has(x.w)) return; seen.add(x.w);
    const role = x.skip ? "⏭️" : x.actor===i ? "🎭" : "🧠";
    out+=`${role} ${CW[x.w][0]} ${cWord(x.w,L)}${cRoman(x.w,L)?` [${cRoman(x.w,L)}]`:""}${L!=="en"?`  (${cWord(x.w,"en")})`:""}\n`; });
  return out+`\n🎭 = you acted · 🧠 = you guessed · ⏭️ = skipped\n\n`;
}

function oCCredit(by){
  const G=O.G, tp=G.tp, actor=G.players[G.turn], g=G.players[by];
  tp.guessed.push({w:tp.w, by}); G.clog.push({actor:G.turn, w:tp.w, by});
  actor.pts++; actor.cact=(actor.cact||0)+1; g.pts++; g.cguess=(g.cguess||0)+1;
  tp.last={w:tp.w, by}; oCPickNext();
}
function oCApply(from, a, isActive, isHost){
  const G=O.G, tp=G.tp;
  switch(a.type){
    case "cstart": if(G.phase==="cturn" && (isActive||isHost) && !tp.timer){
        tp.cstarted=true; oCPickNext();
        const total=G.time; tp.timer={ id:uid(), total, endsAt:Date.now()+total*1000, remainMs:total*1000 };
        if(O.hostTimeout) clearTimeout(O.hostTimeout);
        O.hostTimeout=setTimeout(()=>{ if(O.G.phase==="cturn"){ O.G.tp.timeUp=true; O.G.phase="csum"; pushState(); } }, total*1000+150);
      } return true;
    case "cguess": if(G.phase==="cturn" && (isActive||isHost) && tp.timer && tp.w!==null && G.players[a.by] && a.by!==G.turn){ oCCredit(a.by); } return true;
    case "cclue": if(G.phase==="cturn" && isActive && tp.timer && Array.isArray(a.clue)){
        tp.clue = a.clue.slice(0,12).map(x=>String(x).slice(0,12));
      } return true;
    case "cguesstext": if(G.phase==="cturn" && !isActive && tp.timer && !tp.timeUp && tp.w!==null && a.text){
        const gi=G.players.findIndex(p=>p.id===from); if(gi<0) return true;
        const ok=cMatches(a.text, tp.w, G.players[gi].lang);
        tp.feed=(tp.feed||[]).concat([{by:G.players[gi].name, text:String(a.text).slice(0,60), ok}]).slice(-20);
        if(ok){ oCCredit(gi); }
      } return true;
    case "cskip": if(G.phase==="cturn" && (isActive||isHost) && tp.timer && tp.w!==null){
        tp.skips.push(tp.w); G.clog.push({actor:G.turn, w:tp.w, skip:true}); tp.last={w:tp.w, skip:true}; oCPickNext();
      } return true;
    case "cend": if(G.phase==="cturn" && (isActive||isHost)){ if(O.hostTimeout){ clearTimeout(O.hostTimeout); O.hostTimeout=null; } tp.timeUp=true; G.phase="csum"; } return true;
    case "cnext": if(G.phase==="csum" && (isActive||isHost)){ oAdvance(); } return true;
  }
  return false;
}

  pt:["o","a","os","as","um","uma"], pl:[], uk:[], ar:[]};
function cNorm(s, lang){
  s=String(s||"").toLowerCase().trim();
  if(lang==="ar"||lang==="ur"){ s=s.replace(/[ً-ْـٰ]/g,"").replace(/[أإآ]/g,"ا").replace(/ة/g,"ه").replace(/[ىيےۓ]/g,"ی").replace(/ك/g,"ک").replace(/[هۀہھ]/g,"ہ");
    if(lang==="ar") s=s.replace(/(^|\s)ال/g,"$1"); }
  else { s=s.normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/ß/g,"ss"); }
  s=s.replace(/[.,!?¿¡'"“”„«»()…\-–—]/g," ").replace(/\s+/g," ").trim();
  const arts=(ARTICLES[lang]||[]).map(a=>a.normalize("NFD").replace(/[̀-ͯ]/g,""));
  return s.split(" ").filter(w=>!arts.includes(w)).join(" ");
}
function lev(a,b){ const m=a.length,n=b.length; if(Math.abs(m-n)>2) return 9; const d=Array.from({length:m+1},(_,i)=>[i]); for(let j=1;j<=n;j++) d[0][j]=j;
  for(let i=1;i<=m;i++) for(let j=1;j<=n;j++) d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1)); return d[m][n]; }
function romNorm(s){ return String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/\b(al|an|ar|as|at|ad|ash|adh|az|ath)-/g,"").replace(/['’`\-.,!?…]/g,"").replace(/\s+/g," ").trim(); }
function cMatches(guess, w, lang){
  const rom=cRoman(w,lang);
  if(rom && /[a-z]/i.test(guess)){ const g=romNorm(guess); return rom.split("/").map(romNorm).some(t=>t && (g===t || (t.length>=4 && lev(g,t)<=1) || (t.length>=7 && lev(g,t)<=2))); }
  const g=cNorm(guess,lang); if(!g) return false;
  return cWord(w,lang).split("/").map(x=>cNorm(x,lang)).some(t=> t && (g===t || (t.length>=5 && lev(g,t)<=1) || (t.length>=9 && lev(g,t)<=2)));
}

async function sendCode(){

  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ A.err="Please type a valid email · Bitte gültige E-Mail eingeben"; render(); return; }
  const sb=authClient(); if(!sb){ A.err=offlineMsg(); render(); return; }
  A.busy=true; A.err=""; A.msg=""; render();
  try{
    const { error } = await sb.auth.signInWithOtp({ email, options:{ shouldCreateUser:true } });
    if(error) throw error;
    A.step="code"; A.msg="";
  }catch(e){ A.err=authErr(e); }
  A.busy=false; render();
}
async function verifyCode(){
  const inp=$("acode"), token=((inp&&inp.value)||A.code||"").replace(/\D/g,"");
  A.code=token;
  if(token.length<6){ A.err="Type the code from the email · Code aus der E-Mail eingeben"; render(); return; }
  A.busy=true; A.err=""; render();
  try{
    const { data, error } = await A.sb.auth.verifyOtp({ email:A.email, token, type:"email" });
    if(error) throw error;
    A.busy=false; A.msg="";
    await authSet(data.user || (data.session && data.session.user));
    if(A.profile && A.profile.display_name) authReturn(); else render();
    return;
  }catch(e){ A.err=authErr(e); }

  A.busy=true; A.err=""; render();

function authReturn(){
  // After signing in: go back to where the person came from (e.g. the results screen to save the game)
  const r=A.ret||"home";
  if(r==="results" && S.players.length && S.gid) go("results");
  else if(r==="lobby" && O.G) go("lobby");

function authErr(e){
  const m=String((e&&e.message)||e||"").toLowerCase();
  if(!navigator.onLine) return offlineMsg();
  if(m.includes("rate") || m.includes("security purposes") || m.includes("too many")) return "Too many tries — please wait a minute and try again · Bitte kurz warten";
  if(m.includes("expired") || m.includes("invalid") || m.includes("otp") || m.includes("token")) return "That code is wrong or expired. Try again or send a new one · Code falsch oder abgelaufen";
  if(m.includes("provider is not enabled") || m.includes("unsupported provider")) return "Google sign-in isn't switched on yet · Google-Anmeldung noch nicht aktiv";
  return "Something went wrong — please try again · Etwas ist schiefgelaufen";
}

function gameRecord(mode, ctx, i, key, game){
  const p=ctx.players[i];

  const rating=(p.ratings&&p.ratings.length) ? Math.round(p.ratings.reduce((a,b)=>a+b,0)/p.ratings.length*100)/100 : null;
  let review=""; try{ review=playerReview(i, ctx).slice(0,19000); }catch(e){}
  return { client_key:String(key).slice(0,80), played_at:new Date().toISOString(), mode, game, lang:p.lang, level:p.level,
           rounds:ctx.rounds, players:ctx.players.length, score:p.pts, rank, rating, review };

  const G=O.G, i=G.players.findIndex(p=>p.id===O.me.id); if(i<0) return null;
  return gameRecord("online", oCtx(), i, `on-${G.gid||O.code}-${O.me.id}`, G.game==="charades"?"emoji":"speak");

async function saveRecord(rec){
  if(!A.user) return "auth";
  const row={...rec, user_id:A.user.id};
  try{
    if(!navigator.onLine) throw new Error("offline");
    const { error } = await A.sb.from("games").upsert(row, { onConflict:"user_id,client_key", ignoreDuplicates:true });
    if(error) throw error;
    if(A.games && !A.games.some(g=>g.client_key===rec.client_key)) A.games.unshift({...rec, id:null});
    loadGames();
    return "ok";
  }catch(e){
    const q=lsGet("pt_queue",[]); if(!q.some(r=>r.client_key===rec.client_key)) q.push(rec); lsSet("pt_queue", q.slice(-30));
    return "queued";
  }
}
async function flushQueue(){
  if(!A.user || !navigator.onLine) return;
  const q=lsGet("pt_queue",[]); if(!q.length) return;
  const left=[];
  for(const rec of q){
    try{ const { error } = await A.sb.from("games").upsert({...rec, user_id:A.user.id}, { onConflict:"user_id,client_key", ignoreDuplicates:true }); if(error) throw error; }
    catch(e){ left.push(rec); }
  }
  lsSet("pt_queue", left.length?left:null);
  if(left.length<q.length) loadGames();
}

function acctStats(gs){
  if(!gs.length) return `<p class="note center" style="margin:10px 0">No games yet. Finish a game and tap <b>Save</b> on the results screen!<br><span class="de">Noch keine Spiele gespeichert.</span></p>`;
  const total=gs.reduce((a,g)=>a+(g.score||0),0), wins=gs.filter(g=>g.rank===1&&g.players>1).length;
  const rated=gs.filter(g=>g.rating!=null), avgR=rated.length ? rated.reduce((a,g)=>a+Number(g.rating),0)/rated.length : null;
  const best=Math.max(...gs.map(g=>g.score||0));
  const days=new Set(gs.map(g=>fmtDate(g.played_at))).size;
  const R=avgR!=null ? RATINGS[Math.min(3,Math.max(0,Math.round(avgR)-1))] : null;
  const last=gs.slice(0,10).reverse(), mx=Math.max(1,...last.map(g=>g.score||0));
  const langs={}; gs.forEach(g=>{ langs[g.lang]=(langs[g.lang]||0)+1; });
  return `<div class="sgrid">
