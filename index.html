  .hidden{display:none !important}
  .err{color:var(--coral);font-weight:700;font-size:14px;min-height:18px;margin-top:6px}
</style>
</head>

function loadStats(){ try{ return JSON.parse(localStorage.getItem("ltg_stats")) || {started:0,completed:0,replays:0,ratings:[]}; }catch(e){ return {started:0,completed:0,replays:0,ratings:[]}; } }
function saveStats(s){ try{ localStorage.setItem("ltg_stats", JSON.stringify(s)); }catch(e){} }
function bump(k){ const s=loadStats(); s[k]=(s[k]||0)+1; saveStats(s); }

/* ===================== HELPERS ===================== */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pick = a => a[Math.floor(Math.random()*a.length)];
function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }
function langBadge(l){ return l==="en" ? '<span class="badge b-en">🇬🇧 English</span>' : '<span class="badge b-de">🇩🇪 Deutsch</span>'; }
function avatar(p,i){ return `<div class="avatar" style="background:${COLORS[i%COLORS.length]}">${esc(p.name.charAt(0).toUpperCase())}</div>`; }
function bi(en,de){ return `${en} <span class="de">· ${de}</span>`; }

let audio=null;
function beep(){ try{ if(!audio) return; const o=audio.createOscillator(), g=audio.createGain(); o.connect(g); g.connect(audio.destination); o.frequency.value=880; g.gain.setValueAtTime(.2,audio.currentTime); g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.6); o.start(); o.stop(audio.currentTime+.6);}catch(e){} }
let wake=null;
async function keepAwake(){ try{ if('wakeLock' in navigator && !wake){ wake = await navigator.wakeLock.request('screen'); } }catch(e){} }

function choosePrompt(lang, level){
  const pool = level===0 ? P1 : P, tag = level===0 ? "a1" : "std";
  const fmtKeys = ["role","quick","wwyd"];
  const fmt = fmtKeys[(S.fmtCycle++) % 3];
  const cats = S.cat==="mix" ? shuffle(["everyday","social","work","travel"]) : [S.cat];
  const tryFind = (fmts) => {
    for(const c of cats){ for(const f of fmts){
      const list = pool[lang][c][f].map((x,i)=>({...x,c,f,id:`${lang}-${tag}-${c}-${f}-${i}`})).filter(x=>!S.used.has(x.id));
      if(list.length) return pick(list);
    }}
    return null;
  };
  let p = tryFind([fmt]) || tryFind(shuffle(fmtKeys.slice()));
  if(!p){ // everything used: reset this language
    [...S.used].filter(id=>id.startsWith(`${lang}-${tag}-`)).forEach(id=>S.used.delete(id));
    p = tryFind([fmt]);
  }
  S.used.add(p.id);
  return p;
}

    <div class="prompt">${esc(c.t)}</div>
    <p class="note" style="margin:0 0 10px">${fHow}</p>
    <div class="task">🎯 ${TASKS[L][p.level]}</div>
    <button class="chip" style="margin-top:12px" onclick="$('hints').classList.toggle('show')">💬 ${L==="en"?"Useful words":"Nützliche Wörter"}</button>
    <div class="hints ${p.level===0?"show":""}" id="hints">${c.w.map(w=>`<span class="hint">${esc(w)}</span>`).join("")}</div>
  </div>
  <div id="timerBox" class="hidden">
    <div class="timer" id="timer">0:00</div>
    <div class="bar" id="bar"><i id="barFill"></i></div>
  </div>
  <button class="btn primary" id="startBtn" onclick="startTimer()">▶ ${L==="en"?"Start speaking":"Los, sprich!"}</button>
  <button class="btn secondary hidden" id="doneBtn" onclick="finishTurn()">✓ ${L==="en"?"I'm done":"Fertig"}<small>Feedback time · Zeit für Feedback</small></button>
  ${S.rerolled?"":`<button class="btn ghost" id="rerollBtn" onclick="reroll()">🔄 ${L==="en"?"Different challenge (once)":"Andere Aufgabe (einmal)"}</button>`}`;
},
feedback(){
  const p=S.players[S.turn], L=p.lang;
  const t = S.turnReacts;
  const langName = L==="en" ? "English" : "German · Deutsch";
  return `
  <div class="topline"><span>Feedback for ${esc(p.name)}</span>${langBadge(L)}</div>
  <h2>${bi("How was it?","Wie war's?")}</h2>
  <p class="sub">Everyone taps a reaction — tap once per person.<br><span class="de">Jede Person tippt eine Reaktion.</span></p>
  <div class="reacts">${REACTS.map(r=>`
    <button class="react ${t[r.k]?"hit":""}" onclick="react('${r.k}')">
      ${t[r.k]?`<span class="n">${t[r.k]}</span>`:""}
      <span class="e">${r.e}</span>${r.en}<br><span class="de">${r.de}</span>
    </button>`).join("")}</div>
  <button class="btn ghost" onclick="resetReacts()" style="font-size:13px">Oops, reset reactions</button>
  <div class="coach">
    <h3>🧑‍🏫 Coach moment</h3>
    <p style="margin:0 0 8px;font-size:15px">Whoever speaks the best <b>${langName}</b> at the table: say one phrase that would sound more natural — or a new word ${esc(p.name)} can use.</p>
    <label class="lbl" style="margin-top:10px">✍️ What ${esc(p.name)} said <span class="de">· optional</span></label>
    <textarea id="ans" rows="2" placeholder="A sentence or two from the answer"></textarea>
    <label class="lbl">💡 Tip or better phrase <span class="de">· optional</span></label>
    <textarea id="tip" rows="2" placeholder="e.g. Say “I went” instead of “I go”"></textarea>
    <p class="note" style="margin:6px 0 0">Saved for ${esc(p.name)}'s review at the end · Für die Auswertung gespeichert</p>
  </div>
  <button class="btn primary" onclick="nextTurn()">${isLastTurn()?"See results 🏆":"Next player →"}<small>${isLastTurn()?"Ergebnisse":"Nächste Person"}</small></button>`;
},
results(){
  const ranked = S.players.map((p,i)=>({p,i})).sort((a,b)=>b.p.pts-a.p.pts);
  const medals=["🥇","🥈","🥉"];
  const award = (k,e,en,de) => {
    const best = S.players.map((p,i)=>({p,i})).sort((a,b)=>b.p.reacts[k]-a.p.reacts[k])[0];
    if(!best || best.p.reacts[k]===0) return "";
    return `<div class="award"><span class="e">${e}</span><div>${en} <span class="de">· ${de}</span><br><span style="color:${COLORS[best.i%COLORS.length]}">${esc(best.p.name)}</span></div></div>`;
  };
  return `
  <h1 class="center">🏆</h1>
  <h2 class="center">${bi("Great game!","Super gespielt!")}</h2>
  <div class="card">${ranked.map((r,n)=>`
    <div class="rank"><span class="medal">${medals[n]||"⭐"}</span>${avatar(r.p,r.i)}
      <div><div class="pname">${esc(r.p.name)}</div><div class="pmeta">${r.p.lang==="en"?"🇬🇧":"🇩🇪"} ${LEVELS[r.p.level].code}</div></div>
      <span class="pts">${r.p.pts}</span></div>`).join("")}</div>
  <div class="card">
    <h3>Awards <span class="de">· Auszeichnungen</span></h3>
    ${award("creative","🔥","Most creative","Am kreativsten")}
    ${award("funny","😂","Funniest","Am lustigsten")}
    ${award("clear","👍","Clearest speaker","Am verständlichsten")}
    ${award("learned","💡","Best teacher","Beste/r Lehrer/in")}
  </div>
  <div class="card">
    <h3>📤 Your review <span class="de">· Deine Auswertung</span></h3>
    <p class="note">Each player can send themselves their questions, answers, useful words and tips to practice later.<br><span class="de">Schick dir deine Fragen, Antworten und Tipps zum Wiederholen.</span></p>
    <div class="row" style="margin-top:6px">
    ${S.players.map((p,i)=>`<button class="chip" onclick="openExport(${i})">📤 ${esc(p.name)}</button>`).join("")}
    </div>
    <button class="btn secondary" style="margin-top:12px" onclick="openExport(-1)">📋 Export whole game<small>Ganzes Spiel exportieren (für Organisator/innen)</small></button>
  </div>
  <div class="card center">
    <h3>Did you enjoy it? <span class="de">· Hat's Spaß gemacht?</span></h3>
    <div class="faces">${["😞","😐","🙂","😄","🤩"].map((f,i)=>`<button class="face ${S.rating===i+1?"on":""}" onclick="rate(${i+1})">${f}</button>`).join("")}</div>
  </div>
  <p class="note center" style="margin:4px 0 0">⚠️ Send your reviews before starting a new game · Erst Auswertung senden, dann neu starten</p>
  <button class="btn primary" onclick="playAgain()">🔁 Play another round!<small>Noch eine Runde!</small></button>
  <button class="btn secondary" onclick="newGame()">New players · Neue Spieler</button>
  <a class="powered" href="https://setzio.com" target="_blank" rel="noopener">
    <span class="pw-top">Powered by <b>Setzio</b></span>
    <span class="pw-sub">Booking &amp; CRM app for salons, spas &amp; studios · <u>Try it free</u></span>
    <span class="beta-note">🧪 Free beta test version · Kostenlose Beta-Testversion</span>
  </a>`;
},
stats(){
  const s=loadStats();
  const avg = s.ratings.length ? (s.ratings.reduce((a,b)=>a+b,0)/s.ratings.length).toFixed(1) : "–";
  return `
  <div class="topline"><button class="chip" onclick="go('home')">← Back</button><span>On this device</span></div>
  <h2>Host stats</h2>
  <p class="sub">Your validation numbers, saved only on this phone.</p>
  <div class="card">
    <div class="stat"><span>Games started</span><b>${s.started}</b></div>
    <div class="stat"><span>Games finished</span><b>${s.completed}</b></div>
    <div class="stat"><span>"Play another round" taps</span><b>${s.replays}</b></div>
    <div class="stat"><span>Enjoyment ratings</span><b>${s.ratings.length}</b></div>
    <div class="stat" style="border:none"><span>Average rating (1–5)</span><b>${avg}</b></div>
  </div>
  <button class="btn ghost" onclick="resetStats()">Reset stats</button>`;
}
};
const AFTER = {
  setup(){ const i=$("pname"); if(i){ i.addEventListener("input",e=>S.draft.name=e.target.value); i.addEventListener("keydown",e=>{ if(e.key==="Enter") addPlayer(); }); } }
};

/* ===================== ACTIONS ===================== */
function setDraft(k,v){ S.draft[k]=v; const n=$("pname"); if(n) S.draft.name=n.value; render(); }
function addPlayer(){
  const name=(($("pname")||{}).value||"").trim();
  if(!name){ S.err="Please type a name · Bitte Namen eingeben"; render(); return; }
  if(S.players.length>=10){ S.err="Max 10 players · Maximal 10 Spieler"; render(); return; }
  if(S.players.some(p=>p.name.toLowerCase()===name.toLowerCase())){ S.err="That name is taken · Name schon vergeben"; render(); return; }
  S.players.push({name,lang:S.draft.lang,level:S.draft.level,pts:0,reacts:{clear:0,creative:0,funny:0,learned:0},tips:[]});
  S.draft.name=""; S.err=""; render();
  const i=$("pname"); if(i) i.focus();
}
function removePlayer(i){ S.players.splice(i,1); render(); }
function toSettings(){ if(S.players.length<2){ S.err="Add at least 2 players · Mindestens 2 Spieler"; render(); return; } S.err=""; go("settings"); }
function setOpt(k,v){ S[k]=v; render(); }
function setRounds(d){ S.rounds=Math.min(10,Math.max(1,S.rounds+d)); render(); }
function resetScores(){ S.players.forEach(p=>{p.pts=0;p.reacts={clear:0,creative:0,funny:0,learned:0};p.tips=[];}); }
function startGame(){
  try{ audio = audio || new (window.AudioContext||window.webkitAudioContext)(); }catch(e){}
  keepAwake();
  resetScores(); S.log=[]; S.round=1; S.turn=0; S.rating=null; S.fmtCycle=Math.floor(Math.random()*3);
  bump("started"); go("handoff");
}
function showChallenge(){ keepAwake(); S.current=choosePrompt(S.players[S.turn].lang, S.players[S.turn].level); S.rerolled=false; go("challenge"); }
function reroll(){ S.current=choosePrompt(S.players[S.turn].lang, S.players[S.turn].level); S.rerolled=true; render(); }
function startTimer(){
  try{ if(audio && audio.state==="suspended") audio.resume(); }catch(e){}
  S.total = S.current.f==="quick" ? Math.round(S.time/2) : S.time; S.left=S.total;
  $("timerBox").classList.remove("hidden"); $("startBtn").classList.add("hidden"); $("doneBtn").classList.remove("hidden");
  const rb=$("rerollBtn"); if(rb) rb.classList.add("hidden");
  tick(); S.timerId=setInterval(()=>{ S.left--; tick(); if(S.left<=0){ stopTimer(true); } },1000);
}
function tick(){
  const m=Math.floor(Math.max(S.left,0)/60), s=Math.max(S.left,0)%60;
  const t=$("timer"); if(!t) return;
  t.textContent=`${m}:${String(s).padStart(2,"0")}`;
  const low=S.left<=10; t.classList.toggle("low",low); $("bar").classList.toggle("low",low);
  $("barFill").style.width=`${Math.max(S.left,0)/S.total*100}%`;
}
function stopTimer(ended){ if(S.timerId){ clearInterval(S.timerId); S.timerId=null; } if(ended){ beep(); const t=$("timer"); if(t) t.textContent="⏰ Time!"; } }
function finishTurn(){ stopTimer(false); S.turnReacts={clear:0,creative:0,funny:0,learned:0}; go("feedback"); }
function react(k){ S.turnReacts[k]++; render(); }
function resetReacts(){ S.turnReacts={clear:0,creative:0,funny:0,learned:0}; render(); }
function isLastTurn(){ return S.round===S.rounds && S.turn===S.players.length-1; }
function nextTurn(){
  const p=S.players[S.turn], tip=(($("tip")||{}).value||"").trim(), ans=(($("ans")||{}).value||"").trim();
  if(tip) p.tips.push(tip);
  S.log.push({pi:S.turn, round:S.round, q:S.current.t, f:S.current.f, c:S.current.c, words:S.current.w.slice(), ans, tip, reacts:{...S.turnReacts}});
  let gained=2; for(const k in S.turnReacts){ p.reacts[k]+=S.turnReacts[k]; gained+=S.turnReacts[k]; }
  p.pts+=gained;
  if(isLastTurn()){ bump("completed"); go("results"); return; }
  S.turn++; if(S.turn>=S.players.length){ S.turn=0; S.round++; }
  go("handoff");
}
/* ===================== EXPORT / SHARE ===================== */
function appLink(){ try{ return location.protocol.startsWith("http") ? location.origin : "pontetalk.setzio.com"; }catch(e){ return "pontetalk.setzio.com"; } }
function today(){ const d=new Date(); return `${String(d.getDate()).padStart(2,"0")}.${String(d.getMonth()+1).padStart(2,"0")}.${d.getFullYear()}`; }
function reactLine(r){ return REACTS.filter(x=>r[x.k]).map(x=>`${x.e}${r[x.k]}`).join("  ") || "–"; }
function playerReview(i){
  const p=S.players[i], L=p.lang, turns=S.log.filter(t=>t.pi===i);
  const t=(en,de)=>L==="en"?en:de;
  let out=`🌉 PonteTalk – ${t("Your practice review","Deine Übungs-Auswertung")}\n`;
  out+=`${today()} · ${p.name} · ${L==="en"?"🇬🇧 English":"🇩🇪 Deutsch"} ${LEVELS[p.level].code}\n`;
  out+=`${t("Points","Punkte")}: ${p.pts}\n\n`;
  if(!turns.length) out+=t("No turns played yet.","Noch keine Runden gespielt.")+"\n";
  turns.forEach((x,n)=>{
    const f=FMTS[x.f], c=CATS[x.c];
    out+=`${n+1}) ${f.e} ${L==="en"?f.en:f.de} · ${c.e} ${L==="en"?c.en:c.de}\n`;
    out+=`❓ ${x.q}\n`;
    if(x.ans) out+=`✍️ ${t("You said","Du hast gesagt")}: ${x.ans}\n`;
    if(x.tip) out+=`💡 ${t("Tip","Tipp")}: ${x.tip}\n`;
    out+=`📚 ${t("Useful words","Nützliche Wörter")}: ${x.words.join(", ")}\n`;
    out+=`👏 ${t("Reactions","Reaktionen")}: ${reactLine(x.reacts)}\n\n`;
  });
  out+=`🎯 ${t("Practice idea: answer each question again at home — out loud, using the tip and the useful words.","Übungsidee: Beantworte jede Frage zu Hause noch einmal laut – mit dem Tipp und den nützlichen Wörtern.")}\n\n`;
  out+=`${t("Play again","Nochmal spielen")}: ${appLink()}`;
  return out;
}
function gameReview(){
  let out=`🌉 PonteTalk – Game summary · Spielübersicht\n${today()} · ${S.players.length} players · ${S.rounds} round(s)\n\n`;
  const ranked=S.players.map((p,i)=>({p,i})).sort((a,b)=>b.p.pts-a.p.pts);
  out+=`🏆 Scores\n`+ranked.map((r,n)=>`${n+1}. ${r.p.name} (${r.p.lang==="en"?"EN":"DE"} ${LEVELS[r.p.level].code}) – ${r.p.pts}`).join("\n")+"\n\n";
  S.players.forEach((p,i)=>{
    out+=`━━━━━━━━━━\n👤 ${p.name}\n`;
    S.log.filter(t=>t.pi===i).forEach((x,n)=>{
      out+=`${n+1}) ${x.q}\n`;
      if(x.ans) out+=`   ✍️ ${x.ans}\n`;
      if(x.tip) out+=`   💡 ${x.tip}\n`;
      out+=`   👏 ${reactLine(x.reacts)}\n`;
    });
    out+="\n";
  });
  out+=`${appLink()}`;
  return out;
}
function openExport(i){
  const text = i<0 ? gameReview() : playerReview(i);
  const name = i<0 ? "game" : S.players[i].name;
  const canShare = !!(navigator.share);
  const box=document.createElement("div");
  box.className="sheet-bg";
  box.innerHTML=`<div class="sheet">
    <div class="topline" style="margin-bottom:8px"><h3 style="margin:0">📤 ${i<0?"Whole game":esc(name)}</h3><button class="chip" id="exClose">✕</button></div>
    <textarea id="exText" rows="9" readonly>${esc(text)}</textarea>
    ${canShare?`<button class="btn primary" id="exShare">📲 Send… <small>WhatsApp, Email, Telegram…</small></button>`:""}
    <div class="exgrid">
      <a class="btn secondary exb" id="exWa" href="https://wa.me/?text=${encodeURIComponent(text)}" target="_blank" rel="noopener">💬 WhatsApp</a>
      <a class="btn secondary exb" id="exMail" href="mailto:?subject=${encodeURIComponent("PonteTalk – "+(i<0?"Game summary":"Review "+name))}&body=${encodeURIComponent(text)}">✉️ Email</a>
      <button class="btn secondary exb" id="exCopy">📋 Copy</button>
      <button class="btn secondary exb" id="exDl">⬇️ Save .txt</button>
    </div>
    <p class="note center" id="exMsg" style="min-height:18px;margin:8px 0 0"></p>
  </div>`;
  document.body.appendChild(box);
  const msg=t=>{ $("exMsg").textContent=t; };
  $("exClose").onclick=()=>box.remove();
  box.addEventListener("click",e=>{ if(e.target===box) box.remove(); });
  if(canShare) $("exShare").onclick=async()=>{ try{ await navigator.share({title:"PonteTalk", text}); }catch(e){} };
  $("exCopy").onclick=async()=>{
    try{ await navigator.clipboard.writeText(text); msg("Copied! · Kopiert!"); }
    catch(e){ const t=$("exText"); t.removeAttribute("readonly"); t.select(); try{ document.execCommand("copy"); msg("Copied! · Kopiert!"); }catch(_){ msg("Select the text above and copy it."); } t.setAttribute("readonly",""); }
  };
  $("exDl").onclick=()=>{
    try{ const blob=new Blob([text],{type:"text/plain;charset=utf-8"}); const a=document.createElement("a");
      a.href=URL.createObjectURL(blob); a.download=`PonteTalk-${name.replace(/[^\w-]+/g,"_")}-${today().replace(/\./g,"-")}.txt`;
      document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },500); msg("Saved · Gespeichert"); }
    catch(e){ msg("Couldn't save – try Copy instead."); }
  };
}
function rate(n){ const first=S.rating===null; S.rating=n; const s=loadStats(); if(first) s.ratings.push(n); else s.ratings[s.ratings.length-1]=n; saveStats(s); render(); }
function playAgain(){ bump("replays"); startGame(); }
function newGame(){ S.players=[]; go("setup"); }
function confirmQuit(){
  const box=document.createElement("div");
  box.style.cssText="position:fixed;inset:0;background:rgba(43,33,64,.45);display:grid;place-items:center;padding:20px;z-index:9";
  box.innerHTML=`<div class="card" style="max-width:360px;width:100%"><h3>End this game?</h3><p class="note">Scores so far will be shown.</p>
    <button class="btn primary" id="qYes">Show results</button><button class="btn ghost" id="qNo">Keep playing</button></div>`;
  document.body.appendChild(box);
  $("qNo").onclick=()=>box.remove();
  $("qYes").onclick=()=>{ box.remove(); go("results"); };
}
function resetStats(){ saveStats({started:0,completed:0,replays:0,ratings:[]}); render(); }

render();
/* Offline support + installable app (only works on the real website, safely skipped elsewhere) */
try{ if('serviceWorker' in navigator && location.protocol==='https:'){ window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{})); } }catch(e){}
/* Keep the screen awake again if the phone was switched away and back mid-game */
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible' && S.screen!=='home'){ wake=null; keepAwake(); } });
</script>
</body>
</html>
